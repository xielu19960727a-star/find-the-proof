<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>疑案手札</title>
<!-- PWA & Bookmark Icons -->
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="疑案手札">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;color:#e8e6e3;background:#0f1115}
body{display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;position:relative;background:linear-gradient(180deg,#0f1115,#1a1d24);overflow:hidden}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#2e3440;border-radius:3px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}.screen.active{display:flex;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes cardPulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 20px rgba(212,160,23,.3)}}
@keyframes hpPulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.3);opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(-16px)}}
@keyframes tPulse{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(2.5);opacity:.7}}
.top-bar{display:flex;align-items:center;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(15,17,21,.95);border-bottom:1px solid #2e3440;min-height:48px;gap:10px;flex-shrink:0;z-index:10}
.back-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#9aa0a6;flex-shrink:0;border-radius:50%}
.back-btn:active{background:#2e3440}
.bar-title{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-status{display:flex;align-items:center;gap:10px;font-size:12px;color:#9aa0a6;flex-shrink:0}
.insight{color:#d4a017;display:flex;align-items:center;gap:3px}
.bottom-nav{display:flex;background:rgba(15,17,21,.97);border-top:1px solid #2e3440;padding-bottom:env(safe-area-inset-bottom,0px);flex-shrink:0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;min-height:52px;color:#9aa0a6;font-size:10px;gap:2px;transition:color .2s;position:relative}
.nav-item.active{color:#d4a017}.nav-item.active::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;background:#d4a017;border-radius:0 0 2px 2px}
.nav-item svg{width:20px;height:20px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px;min-height:0}
.card{background:#1e222b;border:1px solid #2e3440;border-radius:12px;padding:14px;margin-bottom:10px;transition:transform .15s}
.card:active{transform:scale(.97)}
.card.highlight{animation:cardPulse .6s ease}
.badge{display:inline-flex;padding:2px 7px;border-radius:8px;font-size:11px;font-weight:500}
.badge-ev{background:rgba(212,160,23,.15);color:#d4a017}.badge-te{background:rgba(142,68,173,.15);color:#8e44ad}
.badge-do{background:rgba(52,152,219,.15);color:#3498db}.badge-re{background:rgba(192,57,43,.15);color:#c0392b}
.menu-screen{justify-content:center;align-items:center;padding:32px;text-align:center}
.menu-title{font-size:28px;font-weight:700;letter-spacing:4px;margin-bottom:6px}
.menu-sub{font-size:13px;color:#9aa0a6;letter-spacing:2px;margin-bottom:40px}
.menu-btn{display:block;width:100%;max-width:260px;padding:13px 20px;margin:0 auto 10px;border-radius:12px;font-size:15px;font-weight:600;transition:all .15s}
.menu-btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,#c0392b,#a93226);color:#fff}
.btn-s{background:#1e222b;border:1px solid #2e3440;color:#e8e6e3}
.btn-g{background:transparent;color:#9aa0a6}
.scene-wrap{position:relative;width:100%;aspect-ratio:3/4;max-height:52vh;background:#161920;border:1px solid #2e3440;border-radius:12px;overflow:hidden;margin-bottom:12px}
.sc-wall{position:absolute;background:#2e3440;border-radius:2px}
.sc-furn{position:absolute;background:#252a35;border:1px solid #353b48;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#9aa0a6}
.hotspot{position:absolute;width:42px;height:42px;transform:translate(-50%,-50%);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%}
.hotspot::before{content:'';position:absolute;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(212,160,23,.5);animation:hpPulse 2s infinite}
.hotspot::after{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:#d4a017}
.hotspot.done::before{border-color:rgba(39,174,96,.5)}.hotspot.done::after{background:#27ae60}
.hotspot.hidden{display:none}
.scene-tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px}
.scene-tab{padding:7px 14px;border-radius:18px;font-size:12px;white-space:nowrap;background:#1e222b;border:1px solid #2e3440;color:#9aa0a6;flex-shrink:0}
.scene-tab.active{background:rgba(212,160,23,.15);border-color:#d4a017;color:#d4a017}
.suspect-card{display:flex;align-items:center;gap:12px;cursor:pointer}
.suspect-av{width:48px;height:48px;border-radius:50%;background:#252a35;border:2px solid #2e3440;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dlg-area{flex:1;overflow-y:auto;padding:14px;min-height:0}
.dlg-bubble{margin-bottom:12px;animation:fadeIn .3s ease}
.dlg-speaker{font-size:12px;font-weight:600;margin-bottom:3px;color:#d4a017}
.dlg-text{font-size:14px;line-height:1.7;background:#252a35;padding:10px 14px;border-radius:10px;border-top-left-radius:3px}
.dlg-text.reveal{border-left:3px solid #8e44ad;background:rgba(142,68,173,.08)}
.dlg-text.contra{border-left:3px solid #c0392b;background:rgba(192,57,43,.08)}
.q-area{padding:10px 14px;border-top:1px solid #2e3440;flex-shrink:0;max-height:40%;overflow-y:auto}
.q-list{display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.q-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;background:#252a35;border-radius:9px;font-size:13px;text-align:left;transition:all .15s}
.q-btn:active{transform:scale(.97)}.q-btn.used{opacity:.35;pointer-events:none}
.ev-btn{display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:18px;font-size:12px;font-weight:600;background:rgba(192,57,43,.15);color:#c0392b;border:1px solid rgba(192,57,43,.3)}
.ev-picker{position:absolute;bottom:0;left:0;right:0;max-height:50%;background:#1a1d24;border-top:1px solid #2e3440;border-radius:14px 14px 0 0;z-index:20;transform:translateY(100%);transition:transform .3s;display:flex;flex-direction:column;overflow:hidden}
.ev-picker.show{transform:translateY(0)}
.ev-item{display:flex;align-items:center;gap:8px;padding:10px;background:#252a35;border-radius:9px;margin-bottom:6px;cursor:pointer;font-size:13px}
.ev-item:active{transform:scale(.97)}
.tl-track{position:relative;padding:16px 0 16px 36px}
.tl-line{position:absolute;left:16px;top:0;bottom:0;width:2px;background:#2e3440}
.tl-slot{position:relative;margin-bottom:18px;min-height:40px}
.tl-dot{position:absolute;left:-27px;top:3px;width:14px;height:14px;border-radius:50%;border:2px solid #2e3440;background:#1a1d24;z-index:1}
.tl-dot.filled{border-color:#d4a017;background:#d4a017}.tl-dot.wrong{border-color:#c0392b;background:#c0392b}
.tl-time{font-size:11px;color:#d4a017;margin-bottom:3px;font-weight:600}
.tl-empty{padding:10px 12px;background:#252a35;border:1px dashed #2e3440;border-radius:9px;font-size:12px;color:#9aa0a6;cursor:pointer}
.tl-filled{padding:10px 12px;background:rgba(212,160,23,.1);border:1px solid rgba(212,160,23,.3);border-radius:9px;font-size:12px;cursor:pointer}
.tl-pool{margin-top:14px;padding-top:12px;border-top:1px solid #2e3440}
.pool-item{padding:10px 12px;background:#252a35;border:1px solid #2e3440;border-radius:9px;font-size:12px;margin-bottom:6px;cursor:pointer}
.pool-item:active{transform:scale(.97)}.pool-item.sel{border-color:#d4a017;background:rgba(212,160,23,.1)}.pool-item.placed{opacity:.3;pointer-events:none}
.check-btn{display:block;margin:14px auto 0;padding:11px 28px;border-radius:11px;font-size:14px;font-weight:600;background:linear-gradient(135deg,#d4a017,#b8860b);color:#0f1115}
.check-btn:disabled{opacity:.35;pointer-events:none}
.clue-filters{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.clue-filter{padding:5px 12px;border-radius:14px;font-size:12px;white-space:nowrap;background:#1e222b;border:1px solid #2e3440;color:#9aa0a6;flex-shrink:0}
.clue-filter.active{background:rgba(212,160,23,.15);border-color:#d4a017;color:#d4a017}
.synth-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0}
.synth-slots{display:flex;align-items:center;gap:10px;width:100%}
.synth-slot{flex:1;min-height:64px;background:#252a35;border:1px dashed #2e3440;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;cursor:pointer;font-size:12px}
.synth-slot.filled{border-style:solid;border-color:#d4a017;background:rgba(212,160,23,.08)}
.synth-result{width:100%;min-height:64px;background:rgba(39,174,96,.08);border:1px solid rgba(39,174,96,.3);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;font-size:13px;color:#27ae60;cursor:pointer}
.acc-suspect{display:flex;align-items:center;gap:10px;padding:12px;background:#252a35;border:2px solid #2e3440;border-radius:10px;margin-bottom:6px;cursor:pointer;transition:all .15s}
.acc-suspect:active{transform:scale(.97)}.acc-suspect.selected{border-color:#c0392b;background:rgba(192,57,43,.08)}
.acc-ev{display:flex;align-items:center;gap:8px;padding:10px;background:#252a35;border:2px solid #2e3440;border-radius:9px;margin-bottom:6px;cursor:pointer;font-size:13px}
.acc-ev:active{transform:scale(.97)}.acc-ev.selected{border-color:#d4a017;background:rgba(212,160,23,.08)}
.chk{width:20px;height:20px;border-radius:50%;border:2px solid #2e3440;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acc-ev.selected .chk{border-color:#d4a017;background:#d4a017;color:#0f1115}
.submit-btn{display:block;width:100%;padding:13px;border-radius:11px;font-size:15px;font-weight:700;text-align:center;margin-top:14px}
.submit-btn.ready{background:linear-gradient(135deg,#c0392b,#a93226);color:#fff}
.submit-btn.not-ready{background:#252a35;color:#9aa0a6;pointer-events:none}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal-ov.show{display:flex}
.modal{background:#1e222b;border:1px solid #2e3440;border-radius:14px;width:100%;max-width:380px;max-height:80vh;overflow-y:auto;animation:fadeIn .3s;margin:auto}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid #2e3440}
.modal-body{padding:14px}.modal-body p{font-size:14px;line-height:1.7;margin-bottom:10px}
.clue-found{display:flex;align-items:center;gap:6px;padding:9px 12px;background:rgba(212,160,23,.1);border:1px solid rgba(212,160,23,.2);border-radius:9px;margin-top:6px;font-size:13px;color:#d4a017;animation:cardPulse .6s}
.modal-ftr{padding:10px 14px;border-top:1px solid #2e3440;display:flex;justify-content:flex-end}
.modal-btn{padding:9px 20px;border-radius:9px;font-size:13px;font-weight:600;background:rgba(212,160,23,.15);color:#d4a017}
#toasts{position:fixed;top:calc(60px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;pointer-events:none;width:88%;max-width:380px}
.toast{padding:10px 16px;border-radius:9px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;animation:toastIn .3s;pointer-events:auto}
.toast.hiding{animation:toastOut .3s forwards}
.toast-clue{background:rgba(212,160,23,.15);border:1px solid rgba(212,160,23,.3);color:#d4a017}
.toast-twist{background:rgba(142,68,173,.2);border:1px solid rgba(142,68,173,.4);color:#8e44ad}
.toast-ok{background:rgba(39,174,96,.15);border:1px solid rgba(39,174,96,.3);color:#27ae60}
.toast-warn{background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.3);color:#c0392b}
.twist-ov{position:fixed;inset:0;background:#0a0b0e;z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;padding:28px;text-align:center}
.twist-ov.show{display:flex}
.twist-pulse{position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(142,68,173,.3),transparent);animation:tPulse 2s infinite}
.twist-text{font-size:18px;font-weight:600;color:#8e44ad;line-height:1.8;z-index:1;min-height:80px;display:flex;align-items:center;justify-content:center}
.twist-skip{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));font-size:13px;color:#9aa0a6;z-index:1}
.end-screen{justify-content:center;align-items:center;padding:28px;text-align:center}
.end-stars{display:flex;gap:6px;margin-bottom:20px}
.end-stars svg{width:36px;height:36px}
.star-f{color:#d4a017}.star-e{color:#2e3440}
.review-banner{background:rgba(142,68,173,.1);border:1px solid rgba(142,68,173,.3);border-radius:9px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:13px;color:#8e44ad}
.contra-card{border-left:3px solid #8e44ad;cursor:pointer;margin-bottom:8px;padding:12px;background:#1e222b;border-radius:0 10px 10px 0}
.contra-card.found{border-left-color:#27ae60;background:rgba(39,174,96,.05)}
.ach-card{display:flex;align-items:center;gap:10px;padding:12px}
.ach-card.unlocked{border-color:rgba(212,160,23,.3)}.ach-card.locked{opacity:.45}
.ach-icon{width:40px;height:40px;border-radius:50%;background:#252a35;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.empty-state{display:flex;flex-direction:column;align-items:center;padding:36px 16px;color:#9aa0a6;text-align:center;gap:10px}
.empty-state svg{width:42px;height:42px;opacity:.3}
.text-muted{color:#9aa0a6}.text-accent{color:#d4a017}.text-danger{color:#c0392b}.text-twist{color:#8e44ad}.text-ok{color:#27ae60}
.divider{height:1px;background:#2e3440;margin:12px 0}
.settings-toggle{display:flex;align-items:center;justify-content:space-between;padding:14px;background:#252a35;border-radius:10px;margin-bottom:10px}
.settings-toggle-label{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500}
.toggle-switch{position:relative;width:48px;height:26px;background:#2e3440;border-radius:13px;cursor:pointer;transition:background .2s}
.toggle-switch.active{background:#d4a017}
.toggle-switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle-switch.active::after{transform:translateX(22px)}
.save-slot{padding:14px;background:#252a35;border:1px solid #2e3440;border-radius:10px;margin-bottom:10px;cursor:pointer;transition:all .15s}
.save-slot:active{transform:scale(.97)}
.save-slot.has-data{border-color:rgba(212,160,23,.3)}
.save-slot-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.save-slot-title{font-size:14px;font-weight:600}
.save-slot-empty{color:#9aa0a6;font-size:13px}
.save-slot-info{display:flex;gap:12px;font-size:12px;color:#9aa0a6}
.settings-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#9aa0a6;border-radius:50%;flex-shrink:0}
.settings-btn:active{background:#2e3440}
.hint-btn{display:flex;align-items:center;gap:4px;padding:4px 10px;background:rgba(212,160,23,.15);border-radius:14px;font-size:12px;font-weight:600;color:#d4a017}
.hint-btn:active{background:rgba(212,160,23,.25)}
</style>
</head>

<symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 21c0-4 3-7 7-7s7 3 7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
<symbol id="i-knife" viewBox="0 0 24 24"><path d="M5 19L15 9l4-4c1-1 1-3 0-3s-2 0-3 1L5 19l-1 2 2-1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>

/* ===== STATE ===== */
let G={screen:'menu',ci:-1,tab:'scene',clues:[],dlog:{},usedQ:{},tlPlace:{},synthDone:[],accSt:{suspect:null,evidence:[]},insight:3,hints:0,stars:{},ach:{},revFound:{},twist:false,selPool:null,selSynth:[0,null,null],synthSlot:1,evPick:false,curSc:0,inter:null,dlgLog:[],clueFilter:'全部',endType:null,slot:0,tutorialShown:false};
let settings={sfx:true,bgm:true};
function saveSettings(){try{localStorage.setItem('det_settings',JSON.stringify(settings))}catch(e){}}
function loadSettings(){try{let d=JSON.parse(localStorage.getItem('det_settings'));if(d)Object.assign(settings,d)}catch(e){}}
function save(slot){
  slot=slot!==undefined?slot:G.slot;
  try{
    let meta={caseName:G.ci>=0?CASES[G.ci].name:'',date:new Date().toLocaleString('zh-CN'),clueCount:G.clues.length,tab:G.tab};
    localStorage.setItem('det_save_'+slot,JSON.stringify({clues:G.clues,dlog:G.dlog,usedQ:G.usedQ,tlPlace:G.tlPlace,synthDone:G.synthDone,insight:G.insight,hints:G.hints,stars:G.stars,ach:G.ach,revFound:G.revFound,ci:G.ci,twist:G.twist,accSt:G.accSt,dlgLog:G.dlgLog,endType:G.endType,selSynth:G.selSynth,curSc:G.curSc,inter:G.inter,tab:G.tab,slot:slot,_meta:meta}));
  }catch(e){}
}
function load(slot){
  slot=slot!==undefined?slot:G.slot;
  try{let d=JSON.parse(localStorage.getItem('det_save_'+slot));if(d){Object.assign(G,d);G.slot=slot;return true}}catch(e){}return false
}
function hasSave(slot){
  try{
    if(slot!==undefined)return!!localStorage.getItem('det_save_'+slot);
    for(let i=0;i<5;i++)if(localStorage.getItem('det_save_'+i))return true;
    return false;
  }catch(e){return false}
}
function getSaveMeta(slot){
  try{let d=JSON.parse(localStorage.getItem('det_save_'+slot));return d?d._meta:null}catch(e){return null}
}
function deleteSave(slot){try{localStorage.removeItem('det_save_'+slot)}catch(e){}}
function CC2(){return G.ci>=0?CASES[G.ci]:null}
function hasClue(id){return G.clues.includes(id)}
function addClue(id){if(!G.clues.includes(id)){G.clues.push(id);save();return true}return false}
function caseClueCount(){let c=CC2();return c?G.clues.filter(id=>c.clues.find(x=>x.id===id)).length:0}
function caseClueTotal(){let c=CC2();return c?c.clues.length:0}

/* ===== AUDIO ===== */
const audioCtx=new(window.AudioContext||window.webkitAudioContext)();
function playSound(type){
  if(!settings.sfx)return;
  try{
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.connect(gain);gain.connect(audioCtx.destination);
    if(type==='clue'){osc.frequency.value=800;gain.gain.setValueAtTime(0.1,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.2);}
    else if(type==='ok'){osc.frequency.value=1000;gain.gain.setValueAtTime(0.1,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3);}
    else if(type==='warn'){osc.frequency.value=400;gain.gain.setValueAtTime(0.1,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.15);}
    else if(type==='twist'){osc.frequency.value=600;osc.frequency.exponentialRampToValueAtTime(300,audioCtx.currentTime+0.5);gain.gain.setValueAtTime(0.1,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.5);}
    osc.start(audioCtx.currentTime);osc.stop(audioCtx.currentTime+0.5);
  }catch(e){}
}

/* ===== UI HELPERS ===== */
function toast(msg,type='clue'){
  playSound(type==='ok'?'ok':type==='twist'?'twist':type==='warn'?'warn':'clue');
  let el=document.createElement('div');el.className=`toast toast-${type}`;
  el.innerHTML=`${S(type==='ok'?'i-check':type==='twist'?'i-exclaim':type==='warn'?'i-exclaim':'i-key',16)}<span>${msg}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{el.classList.add('hiding');setTimeout(()=>el.remove(),300)},2000);
}
function showModal(title,body,footer=''){
  document.getElementById('modal-box').innerHTML=`<div class="modal-hdr"><span style="font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px">${title}</span><button class="modal-btn" onclick="closeModal()">${S('i-close',18)}</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-ftr">${footer}</div>`:''}`;
  document.getElementById('modal-ov').classList.add('show');
}
function closeModal(){document.getElementById('modal-ov').classList.remove('show')}
document.getElementById('modal-ov').addEventListener('click',e=>{if(e.target.id==='modal-ov')closeModal()});

/* ===== HINT SYSTEM ===== */
function showHint(){
  if(G.insight<=0){toast('洞察点已用完','warn');return}
  let c=CC2();if(!c)return;
  let hints=[];
  if(G.tab==='scene'){
    let sc=c.scenes[G.curSc];
    let unexplored=sc.hotspots.filter(h=>h.clues.some(cl=>!hasClue(cl)));
    if(unexplored.length>0)hints.push(`场景中还有${unexplored.length}个可疑点未调查`);
  }else if(G.tab==='suspect'){
    let uninterrogated=c.suspects.filter(s=>!G.usedQ[s.id]||G.usedQ[s.id].length===0);
    if(uninterrogated.length>0)hints.push(`还有${uninterrogated.length}位嫌疑人未询问`);
  }else if(G.tab==='timeline'){
    let pl=G.tlPlace[c.id]||{};
    let placed=Object.keys(pl).length;
    let total=c.timeline.events.length;
    if(placed<total)hints.push(`时间线还有${total-placed}个事件未放置`);
  }else if(G.tab==='clues'){
    let available=c.synthesis.filter(sy=>!G.synthDone.includes(sy.input.slice().sort().join(',')));
    if(available.length>0)hints.push(`还有${available.length}组合成线索可发现`);
  }else if(G.tab==='accuse'){
    if(!G.accSt.suspect)hints.push('选择你认为的凶手');
    else if(G.accSt.evidence.length<2)hints.push('至少选择2条关键证据');
  }
  if(hints.length===0)hints.push('继续探索，真相就在眼前');
  G.insight--;G.hints++;save();
  showModal(`${S('i-bulb',18)} 洞察提示`,`<p style="line-height:1.8">${hints[0]}</p><p style="font-size:12px;color:#9aa0a6;margin-top:12px">剩余洞察点：${G.insight}</p>`,`<button class="modal-btn" onclick="closeModal();render()">确定</button>`);
}

function rCases(){
  let h=`<div class="screen active"><div class="top-bar"><button class="back-btn" onclick="G.screen='menu';render()">${S('i-arrow-l')}</button><span class="bar-title">选择案件</span></div><div class="content">`;

    let diffStars=c.diff||1;
    h+=`<div class="card" style="cursor:pointer" onclick="selCase(${i})">
      <div style="font-size:11px;color:#d4a017;letter-spacing:2px;margin-bottom:3px">案件 ${c.num}</div>
      <div style="font-size:17px;font-weight:700;margin-bottom:4px">${c.name}</div>
      <div style="font-size:13px;color:#9aa0a6;line-height:1.5;margin-bottom:8px">${c.brief}</div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;gap:2px">${[1,2,3,4,5].map(n=>`<span style="color:${n<=diffStars?'#d4a017':'#2e3440'}">${S('i-star-f',14)}</span>`).join('')}</div>
        <div style="display:flex;gap:3px">${[1,2,3].map(n=>`<span style="color:${n<=st?'#d4a017':'#2e3440'}">${S('i-star-f',16)}</span>`).join('')}</div>

function selCase(i){
  G.ci=i;G.clues=[];G.dlog={};G.usedQ={};G.tlPlace={};G.synthDone=[];G.accSt={suspect:null,evidence:[]};G.insight=3;G.hints=0;G.revFound={};G.twist=false;G.curSc=0;G.tab='scene';G.inter=null;G.dlgLog=[];G.clueFilter='全部';
  save();G.screen='game';render();
  let showTutorial=!G.tutorialShown;
  setTimeout(()=>{
    showModal(`${S('i-folder',18)} 案件简报`,`<p style="line-height:1.8">${CASES[i].briefing}</p>`,`<button class="modal-btn" onclick="closeModal();${showTutorial?'setTimeout(showTutorial,300)':''}">开始调查</button>`);
  },300);
}
function rGame(){
  let c=CC2();if(!c)return;
  let cn=caseClueCount(),ct=caseClueTotal();
  let tabs=[{id:'scene',ic:'i-map',l:'场景'},{id:'suspect',ic:'i-users',l:'嫌疑人'},{id:'timeline',ic:'i-timeline',l:'时间线'},{id:'clues',ic:'i-clipboard',l:'线索'},{id:'accuse',ic:'i-gavel',l:'指认'}];
  let rb=G.twist?`<div class="review-banner">${S('i-exclaim',16)} 卷宗重审模式 — 找出所有矛盾点</div>`:'';
  let content='';
  switch(G.tab){case'scene':content=rScene(c);break;case'suspect':content=rSuspects(c);break;case'timeline':content=rTimeline(c);break;case'clues':content=rClues(c);break;case'accuse':content=rAccuse(c);break;}
  app.innerHTML=`<div class="screen active">
    <div class="top-bar"><button class="back-btn" onclick="G.screen='cases';render()">${S('i-arrow-l')}</button><span class="bar-title">${c.num} · ${c.name}</span><div class="bar-status"><button class="hint-btn" onclick="showHint()" title="洞察提示">${S('i-bulb',16)}${G.insight}</button><span>${cn}/${ct}</span></div><button class="settings-btn" onclick="showSettings()">${S('i-settings',20)}</button></div>
    <div class="content">${rb}${content}</div>
    <div class="bottom-nav">${tabs.map(t=>`<button class="nav-item${G.tab===t.id?' active':''}" onclick="G.tab='${t.id}';render()">${S(t.ic,20)}<span>${t.l}</span></button>`).join('')}</div>
  </div>`;

/* Scene */
function rScene(c){
  let sc=c.scenes[G.curSc];
  let tabs=c.scenes.map((s,i)=>`<button class="scene-tab${i===G.curSc?' active':''}" onclick="G.curSc=${i};render()">${s.name}</button>`).join('');
  let ly=sc.layout;
  let walls=ly.walls.map(w=>`<div class="sc-wall" style="left:${w.x}%;top:${w.y}%;width:${w.w}%;height:${w.h}%"></div>`).join('');
  let furn=ly.furniture.map(f=>`<div class="sc-furn" style="left:${f.x}%;top:${f.y}%;width:${f.w}%;height:${f.h}%">${f.l||''}</div>`).join('');
  let hps=sc.hotspots.map(h=>{
    let done=h.clues.every(cl=>hasClue(cl));
    let hid=h.requires&&!hasClue(h.requires);
    return`<div class="hotspot${done?' done':''}${hid?' hidden':''}" style="left:${h.x}%;top:${h.y}%" onclick="clickHP('${h.id}')">${S(IC[h.ic]||'i-search',20)}</div>`;
  }).join('');
  return`<div class="scene-tabs">${tabs}</div><div class="scene-wrap">${walls}${furn}${hps}<div style="position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:#9aa0a6">${sc.name}</div></div><div style="font-size:13px;color:#9aa0a6;text-align:center">点击发光点调查</div>`;
}
function clickHP(hid){
  let c=CC2(),sc=c.scenes[G.curSc],h=sc.hotspots.find(x=>x.id===hid);if(!h)return;
  let nw=h.clues.filter(cl=>!hasClue(cl));
  nw.forEach(cl=>{addClue(cl);let cd=c.clues.find(x=>x.id===cl);if(cd)toast(`发现：${cd.n}`)});
  let ch=nw.map(cl=>{let cd=c.clues.find(x=>x.id===cl);return cd?`<div class="clue-found">${S('i-key',16)}${cd.n}</div>`:''}).join('');
  if(!nw.length&&!h.clues.length)ch='<p style="color:#9aa0a6;font-size:13px">没有更多发现了。</p>';
  showModal(`${S('i-search',18)} ${h.name}`,`<p>${h.desc}</p>${ch}`,`<button class="modal-btn" onclick="closeModal();render()">确定</button>`);
}

/* Suspects */
function rSuspects(c){
  if(G.inter!==null)return rInter(c);
  return c.suspects.map(s=>`<div class="card suspect-card" onclick="G.inter='${s.id}';G.dlgLog=[];render()">
    <div class="suspect-av">${S('i-person',26)}</div>
    <div style="flex:1"><div style="font-size:15px;font-weight:600">${s.name}</div><div style="font-size:12px;color:#9aa0a6">${s.role}</div></div>
    ${S('i-arrow-r',18)}
  </div>`).join('');
}
function rInter(c){
  let s=c.suspects.find(x=>x.id===G.inter);if(!s)return'';
  if(!G.dlgLog)G.dlgLog=[];
  let logH=G.dlgLog.map(d=>`<div class="dlg-bubble"><div class="dlg-speaker">${d.w}</div><div class="dlg-text${d.rev?' reveal':''}${d.con?' contra':''}">${d.t}</div></div>`).join('');
  let qs=s.dlgs.filter((d,i)=>d.q&&(d.req?hasClue(d.req):true)&&(!G.usedQ[G.inter]||!G.usedQ[G.inter].includes(i)));
  let qH=qs.length?qs.map(d=>{
    let ri=s.dlgs.indexOf(d);
    if(d.ev&&!hasClue(d.ev))return'';
    return`<button class="q-btn" onclick="askQ(${ri})">${S('i-chat',16)}${d.q}</button>`;
  }).join(''):'<div style="font-size:13px;color:#9aa0a6;padding:8px">暂无更多问题</div>';
  return`<div style="display:flex;flex-direction:column;height:100%;overflow:hidden">
    <div style="display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #2e3440;flex-shrink:0">
      <div class="suspect-av">${S('i-person',26)}</div>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">${s.name}</div><div style="font-size:12px;color:#9aa0a6">${s.role}</div></div>
      <button class="back-btn" onclick="G.inter=null;render()">${S('i-arrow-l')}</button>
    </div>
    <div class="dlg-area">${logH}</div>
    <div class="q-area">
      <div style="display:flex;gap:6px;padding:8px 0;flex-shrink:0"><button class="ev-btn" onclick="G.evPick=!G.evPick;render()">${S('i-key',14)}出示证据</button></div>
      <div class="q-list">${qH}</div>
    </div>
    <div class="ev-picker${G.evPick?' show':''}">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #2e3440;flex-shrink:0"><span style="font-size:14px;font-weight:600">选择证据</span><button class="modal-btn" onclick="G.evPick=false;render()">${S('i-close',16)}</button></div>
      <div style="flex:1;overflow-y:auto;padding:10px 14px">${rEvPick(c)}</div>
    </div>
  </div>`;
}
function rEvPick(c){
  return G.clues.filter(cl=>c.clues.find(x=>x.id===cl)).map(cl=>{
    let cd=c.clues.find(x=>x.id===cl);
    return`<div class="ev-item" onclick="presentEv('${cl}')">${S('i-key',18)}<div><div style="font-weight:500">${cd.n}</div></div></div>`;
  }).join('')||'<div style="color:#9aa0a6;font-size:13px;padding:8px">暂无可用证据</div>';
}
function askQ(idx){
  let c=CC2(),s=c.suspects.find(x=>x.id===G.inter),d=s.dlgs[idx];if(!d)return;
  if(!G.usedQ[G.inter])G.usedQ[G.inter]=[];
  G.usedQ[G.inter].push(idx);
  G.dlgLog.push({w:'你',t:d.q});
  G.dlgLog.push({w:s.name,t:d.a||d.t,rev:!!(d.r&&d.r.length),con:!!d.c});
  if(d.r)d.r.forEach(r=>{if(addClue(r)){let cd=c.clues.find(x=>x.id===r);if(cd)toast(`解锁：${cd.n}`)}});
  save();render();
  let area=document.querySelector('.dlg-area');if(area)area.scrollTop=area.scrollHeight;
}
function presentEv(clueId){
  G.evPick=false;
  let c=CC2(),s=c.suspects.find(x=>x.id===G.inter);
  let m=s.dlgs.find((d,i)=>d.ev===clueId&&(!G.usedQ[G.inter]||!G.usedQ[G.inter].includes(i)));
  if(m){G.dlgLog.push({w:'你',t:`（出示：${c.clues.find(x=>x.id===clueId)?.n}）`});askQ(s.dlgs.indexOf(m));}
  else{G.dlgLog.push({w:'你',t:`（出示：${c.clues.find(x=>x.id===clueId)?.n}）`});G.dlgLog.push({w:s.name,t:'这和我的供述没有关系。'});toast('证据不相关','warn');save();render();}
}

/* Timeline */
function rTimeline(c){
  let tl=c.timeline,pl=G.tlPlace[c.id]||{};
  let sorted=tl.events.slice().sort((a,b)=>a.order-b.order);
  let slots=sorted.map(ev=>{
    let pid=pl[ev.order],ok=pid===ev.id,pev=pid?tl.events.find(e=>e.id===pid):null;
    return`<div class="tl-slot"><div class="tl-dot${pid?(ok?' filled':' wrong'):''}"></div><div class="tl-time">${ev.time}</div>${pev?`<div class="tl-filled" onclick="rmTL(${ev.order})">${pev.text}</div>`:`<div class="tl-empty" onclick="selTL(${ev.order})">点击放置事件</div>`}</div>`;
  }).join('');
  let pool=tl.events.filter(e=>!Object.values(pl).includes(e.id));
  let poolH=pool.map(e=>`<div class="pool-item${G.selPool===e.id?' sel':''}" onclick="G.selPool='${e.id}';render()">${e.text}（${e.time}）</div>`).join('');
  let allDone=Object.keys(pl).length===tl.events.length;
  return`<div class="tl-track"><div class="tl-line"></div>${slots}</div><div class="tl-pool"><div style="font-size:12px;color:#9aa0a6;margin-bottom:8px">${S('i-clock',14)} 待放置事件</div>${poolH||'<div style="color:#9aa0a6;font-size:12px">全部已放置</div>'}</div>${allDone?`<button class="check-btn" onclick="checkTL()">确认时间线</button>`:''}`;
}
function selTL(order){if(!G.selPool)return toast('先选择下方事件','warn');if(!G.tlPlace[CC2().id])G.tlPlace[CC2().id]={};G.tlPlace[CC2().id][order]=G.selPool;G.selPool=null;save();render();}
function rmTL(order){if(G.tlPlace[CC2().id]){delete G.tlPlace[CC2().id][order];save();render();}}
function checkTL(){let c=CC2(),pl=G.tlPlace[c.id]||{};if(c.timeline.events.every(e=>pl[e.order]===e.id))toast('时间线正确！','ok');else toast('有误，检查标红位置','warn');}

/* Clues */
function rClues(c){
  let flt=G.clueFilter,cats=['全部','物证','口供','文件','推理'];
  let fl=flt==='全部'?G.clues:G.clues.filter(cl=>{let cd=c.clues.find(x=>x.id===cl);return cd&&cd.cat===flt});
  let fltH=cats.map(cat=>`<button class="clue-filter${flt===cat?' active':''}" onclick="G.clueFilter='${cat}';render()">${cat}</button>`).join('');
  let cards=fl.map(cl=>{let cd=c.clues.find(x=>x.id===cl);if(!cd)return'';
    return`<div class="card" style="padding:12px"><div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span class="badge ${CC[cd.cat]||'badge-ev'}">${cd.cat}</span><span style="font-size:14px;font-weight:600;flex:1">${cd.n}</span></div><div style="font-size:13px;color:#9aa0a6;line-height:1.5">${cd.d}</div></div>`;
  }).join('');
  let synth=rSynth(c);
  return`<div class="clue-filters">${fltH}</div>${cards||'<div class="empty-state">'+S('i-clipboard',42)+'<div>暂无线索</div></div>'}<div class="divider"></div><div style="font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px">${S('i-plus',16)}线索合成</div>${synth}`;
}
function rSynth(c){
  if(!c.synthesis)return'';
  let s0=G.selSynth[1],s1=G.selSynth[2];
  let avail=c.synthesis.filter(sy=>!G.synthDone.includes(sy.input.slice().sort().join(',')));
  let cls=G.clues.filter(cl=>c.clues.find(x=>x.id===cl));
  let slotH=idx=>{let sel=idx===1?s0:s1;if(sel){let cd=c.clues.find(x=>x.id===sel);return cd?`<div style="font-size:12px;font-weight:500">${cd.n}</div>`:''}return'<div style="color:#9aa0a6;font-size:11px">选择线索</div>'};
  let poolH=cls.map(cl=>{let cd=c.clues.find(x=>x.id===cl);let used=(s0===cl||s1===cl);return`<div class="pool-item${used?' sel':''}" style="padding:8px 10px;font-size:12px;margin-bottom:4px" onclick="pickSy(${G.synthSlot},'${cl}')">${cd.n}</div>`}).join('');
  let resH='';
  if(s0&&s1){
    let recipe=avail.find(sy=>{let inp=sy.input.slice().sort(),sel=[s0,s1].sort();return inp[0]===sel[0]&&inp[1]===sel[1]});
    if(recipe)resH=`<div class="synth-result" onclick="doSynth('${recipe.input.slice().sort().join(',')}','${recipe.output}')"><div><div style="font-weight:600;margin-bottom:4px">${S('i-bulb',16)} 点击合成</div></div></div>`;
    else if(G.synthDone.find(d=>{let inp=d.split(',');return inp.includes(s0)&&inp.includes(s1)}))resH=`<div class="synth-result" style="border-color:#2e3440;color:#9aa0a6">已合成过</div>`;
    else resH=`<div class="synth-result" style="border-color:rgba(192,57,43,.3);color:#c0392b">无法合成</div>`;
  }
  return`<div class="synth-wrap"><div class="synth-slots"><div class="synth-slot${s0?' filled':''}" onclick="G.synthSlot=1;render()">${slotH(1)}</div><div style="font-size:20px;color:#d4a017;font-weight:700">+</div><div class="synth-slot${s1?' filled':''}" onclick="G.synthSlot=2;render()">${slotH(2)}</div></div><div style="font-size:20px;color:#9aa0a6;font-weight:700">=</div>${resH||'<div class="synth-result" style="border-color:#2e3440;color:#9aa0a6">选择两条线索合成</div>'}<div style="width:100%;margin-top:8px"><div style="font-size:12px;color:#9aa0a6;margin-bottom:6px">选择线索：</div>${poolH}</div></div>`;
}
function pickSy(slot,cl){G.selSynth[slot]=cl;render()}
function doSynth(key,output){G.synthDone.push(key);addClue(output);let cd=CC2().clues.find(x=>x.id===output);if(cd)toast(`合成：${cd.n}`,'ok');G.selSynth=[0,null,null];save();render();}

/* Accuse */
function rAccuse(c){
  if(!G.accSt||!G.accSt.evidence)G.accSt={suspect:null,evidence:[]};
  let as=G.accSt;
  let susH=c.suspects.map(s=>`<div class="acc-suspect${as.suspect===s.id?' selected':''}" onclick="G.accSt.suspect='${s.id}';render()"><div class="suspect-av" style="width:40px;height:40px">${S('i-person',22)}</div><div style="flex:1"><div style="font-size:14px;font-weight:600">${s.name}</div><div style="font-size:12px;color:#9aa0a6">${s.role}</div></div></div>`).join('');
  let evH=G.clues.filter(cl=>c.clues.find(x=>x.id===cl)).map(cl=>{let cd=c.clues.find(x=>x.id===cl),sel=as.evidence.includes(cl);
    return`<div class="acc-ev${sel?' selected':''}" onclick="togAccEv('${cl}')"><div class="chk">${sel?S('i-check',14):''}</div><div style="flex:1;font-size:13px;font-weight:500">${cd.n}</div></div>`;
  }).join('');
  let ready=as.suspect&&as.evidence.length>=2;
  // If in twist phase, show contradictions
  let contraH='';
  if(G.twist&&c.twist){
    let found=G.revFound[c.id]||[];
    contraH=`<div class="divider"></div><div style="font-size:14px;font-weight:600;color:#8e44ad;margin-bottom:8px">${S('i-exclaim',16)} 矛盾点 (${found.length}/${c.twist.contras.length})</div>`;
    contraH+=c.twist.contras.map((ct,i)=>{
      let isFound=found.includes(i);
      return`<div class="contra-card${isFound?' found':''}" onclick="findContra(${i})"><div style="font-size:13px;line-height:1.6">${ct.text}</div>${isFound?`<div style="font-size:12px;color:#27ae60;margin-top:4px">已发现</div>`:''}</div>`;
    }).join('');
    let allFound=found.length>=c.twist.contras.length;
    if(allFound)contraH+=`<button class="submit-btn ready" style="margin-top:12px" onclick="trueEnding()">揭示真相</button>`;
  }
  return`<div style="font-size:14px;font-weight:600;color:#d4a017;margin-bottom:8px">${S('i-gavel',16)}选择嫌疑人</div>${susH}<div class="divider"></div><div style="font-size:14px;font-weight:600;color:#d4a017;margin-bottom:8px">${S('i-key',16)}选择关键证据（至少2条）</div>${evH}${!G.twist?`<button class="submit-btn ${ready?'ready':'not-ready'}" onclick="submitAcc()">提交指认</button>`:''}${contraH}`;
}
function togAccEv(cl){let as=G.accSt,i=as.evidence.indexOf(cl);if(i>=0)as.evidence.splice(i,1);else if(as.evidence.length<3)as.evidence.push(cl);render();}
function submitAcc(){
  let c=CC2(),as=G.accSt;if(!as.suspect||as.evidence.length<2)return;
  G.twist=true;save();
  showTwist(c.twist.text,()=>{G.tab='accuse';save();render();toast('卷宗重审模式','twist');});
}
function findContra(idx){
  let c=CC2();if(!G.revFound[c.id])G.revFound[c.id]=[];
  if(!G.revFound[c.id].includes(idx)){G.revFound[c.id].push(idx);let ct=c.twist.contras[idx];if(ct.ev&&addClue(ct.ev)){let cd=c.clues.find(x=>x.id===ct.ev);if(cd)toast(`发现：${cd.n}`,'ok');}save();render();}
}
function trueEnding(){
  let c=CC2(),as=G.accSt;
  let perfect=as.suspect===c.accusation.suspect&&c.accusation.evidence.every(e=>as.evidence.includes(e))&&G.hints===0;
  let trueEnd=as.suspect===c.accusation.suspect;
  G.endType=perfect?'perfect':trueEnd?'true_end':'surface';
  G.stars[c.id]=Math.max(G.stars[c.id]||0,c.endings[G.endType].stars);
  unlockAch(c.id+'_clear');
  if(G.stars[c.id]>=3)unlockAch(c.id+'_perfect');
  if(CASES.every(cs=>G.stars[cs.id]>0))unlockAch('all_clear');
  if(CASES.every(cs=>G.stars[cs.id]>=3))unlockAch('all_perfect');
  save();G.screen='ending';render();
}

/* Ending */
function rEnd(){
  let c=CC2(),end=c.endings[G.endType];
  let starsH=[1,2,3].map(n=>`<span class="${n<=end.stars?'star-f':'star-e'}">${S('i-star-f',36)}</span>`).join('');
  let reviewH='';
  if(G.endType==='perfect'||G.endType==='true_end'){
    let susName=c.suspects.find(s=>s.id===c.accusation.suspect)?.name||'未知';
    let evNames=c.accusation.evidence.map(eid=>c.clues.find(cl=>cl.id===eid)?.n||'').filter(Boolean);
    reviewH=`<div style="font-size:13px;color:#9aa0a6;margin-bottom:16px;text-align:left;width:100%;max-width:380px">
      <div style="font-size:14px;font-weight:600;color:#d4a017;margin-bottom:8px">${S('i-bulb',16)} 推理回顾</div>
      <div style="background:#1e222b;padding:12px;border-radius:10px;border:1px solid #2e3440;line-height:1.7">
        <div style="margin-bottom:6px"><strong>凶手：</strong>${susName}</div>
        <div style="margin-bottom:6px"><strong>关键证据：</strong>${evNames.join('、')}</div>
        <div><strong>推理过程：</strong>${c.accusation.summary||end.desc}</div>
      </div>
    </div>`;
  }
  app.innerHTML=`<div class="screen active end-screen">
    <div class="end-stars">${starsH}</div>
    <div style="font-size:22px;font-weight:700;margin-bottom:6px">${end.title}</div>
    <div style="font-size:13px;color:#9aa0a6;margin-bottom:20px">${c.name} · ${end.stars}星结局</div>
    <div style="font-size:14px;line-height:1.7;color:#9aa0a6;margin-bottom:24px;text-align:left;background:#1e222b;padding:14px;border-radius:10px;border:1px solid #2e3440;max-height:180px;overflow-y:auto">${end.desc}</div>
    ${reviewH}
    <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px">
      <button class="menu-btn btn-p" onclick="G.screen='cases';render()">返回案件列表</button>
      <button class="menu-btn btn-s" onclick="selCase(${G.ci})">重新调查</button>
      <button class="menu-btn btn-g" onclick="G.screen='menu';render()">主菜单</button>
    </div>
  </div>`;
}

/* Achievements */
function rAch(){
  let achs=[
    {id:'c1_clear',n:'雨夜初晴',d:'通关案件001'},
    {id:'c1_perfect',n:'完美推理',d:'三星通关案件001'},
    {id:'c2_clear',n:'密室破译',d:'通关案件002'},
    {id:'c2_perfect',n:'完美推理',d:'三星通关案件002'},
    {id:'c3_clear',n:'列车迷踪',d:'通关案件003'},
    {id:'c3_perfect',n:'完美推理',d:'三星通关案件003'},
    {id:'all_clear',n:'大侦探',d:'通关全部案件'},
    {id:'all_perfect',n:'传奇侦探',d:'全部三星通关'}
  ];
  let h=`<div class="screen active"><div class="top-bar"><button class="back-btn" onclick="G.screen='menu';render()">${S('i-arrow-l')}</button><span class="bar-title">成就</span></div><div class="content">`;
  achs.forEach(a=>{
    let unlocked=G.ach[a.id];
    h+=`<div class="card ach-card ${unlocked?'unlocked':'locked'}"><div class="ach-icon" style="color:${unlocked?'#d4a017':'#9aa0a6'}">${S(unlocked?'i-trophy':'i-shield',22)}</div><div><div style="font-size:14px;font-weight:600">${a.n}</div><div style="font-size:12px;color:#9aa0a6">${a.d}</div></div></div>`;
  });
  h+=`</div></div>`;app.innerHTML=h;
}
function unlockAch(id){if(!G.ach[id]){G.ach[id]=true;save();toast('成就解锁！','ok');}}

/* Init */
loadSettings();
render();
</script>
</body>
</html>
