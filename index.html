  let c=CC2();if(!c)return;
  let cn=caseClueCount(),ct=caseClueTotal();
  let tabs=[{id:'scene',ic:'i-map',l:'场景'},{id:'suspect',ic:'i-users',l:'嫌疑人'},{id:'timeline',ic:'i-timeline',l:'时间线'},{id:'clues',ic:'i-clipboard',l:'线索'},{id:'accuse',ic:'i-gavel',l:'指认'}];
  let rb=G.twist?`<div class="review-banner">${S('i-exclaim',16)} 卷宗重审模式 — 找出所有矛盾点</div>`:'';
  let content='';
  switch(G.tab){case'scene':content=rScene(c);break;case'suspect':content=rSuspects(c);break;case'timeline':content=rTimeline(c);break;case'clues':content=rClues(c);break;case'accuse':content=rAccuse(c);break;}
  app.innerHTML=`<div class="screen active">
    <div class="top-bar"><button class="back-btn" onclick="confirmBack()">${S('i-arrow-l')}</button><span class="bar-title">${c.num} · ${c.name}</span><div class="bar-status"><button class="hint-btn" onclick="showHint()" title="洞察提示">${S('i-bulb',16)}${G.insight}</button><span>${cn}/${ct}</span></div><button class="settings-btn" onclick="showSettings()">${S('i-settings',20)}</button></div>
    <div class="content content-inner">${rb}${content}</div>
    <div class="bottom-nav">${tabs.map(t=>`<button class="nav-item${G.tab===t.id?' active':''}" onclick="playSoundEx('click');G.tab='${t.id}';render()">${S(t.ic,20)}<span>${t.l}</span></button>`).join('')}</div>
  </div>`;
  if(G.tab==='scene'){let sw=document.getElementById('scene-wrap');if(sw){let atmo=renderAtmo(c.scenes[G.curSc].id);sw.appendChild(atmo);setupLongPress(sw)}}
  let nbBtn=document.createElement('button');nbBtn.className='notebook-btn';nbBtn.innerHTML=S('i-book',20);nbBtn.onclick=toggleNotebook;app.appendChild(nbBtn);
}
function setupLongPress(el){
  let timer=null,startX=0,startY=0;
  el.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;timer=setTimeout(()=>{let c=CC2(),sc=c.scenes[G.curSc];addNote(`场景笔记 [${sc.name}]: 发现可疑之处…`);toast('已记录到笔记本','ok');if(navigator.vibrate)navigator.vibrate(50)},600)},{passive:true});
  el.addEventListener('touchmove',e=>{let dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;if(Math.sqrt(dx*dx+dy*dy)>10&&timer){clearTimeout(timer);timer=null}},{passive:true});
  el.addEventListener('touchend',()=>{if(timer){clearTimeout(timer);timer=null}},{passive:true});
  el.addEventListener('touchcancel',()=>{if(timer){clearTimeout(timer);timer=null}},{passive:true});
}
function confirmBack(){
  showConfirm('确定要离开当前案件吗？未保存的进度将丢失。',()=>{G.screen='cases';render();});
}

/* Scene */
function rScene(c){
  let sc=c.scenes[G.curSc];
  let tabs=c.scenes.map((s,i)=>`<button class="scene-tab${i===G.curSc?' active':''}" onclick="playSoundEx('page');G.curSc=${i};render()">${s.name}</button>`).join('');
  let ly=sc.layout;
  let walls=ly.walls.map(w=>`<div class="sc-wall" style="left:${w.x}%;top:${w.y}%;width:${w.w}%;height:${w.h}%"></div>`).join('');
  let furn=ly.furniture.map(f=>`<div class="sc-furn" style="left:${f.x}%;top:${f.y}%;width:${f.w}%;height:${f.h}%" data-label="${f.l||''}"></div>`).join('');
  let hps=sc.hotspots.map(h=>{
    let done=h.clues.every(cl=>hasClue(cl));
    let hid=h.requires&&!hasClue(h.requires);
    return`<div class="hotspot${done?' done':''}${hid?' hidden':''}" style="left:${h.x}%;top:${h.y}%" onclick="clickHP('${h.id}')">${S(IC[h.ic]||'i-search',20)}<span class="hp-label">${h.name||''}</span></div>`;
  }).join('');
  return`<div class="scene-tabs">${tabs}</div><div class="scene-wrap ${sceneBgClass(sc.id)}" id="scene-wrap">${walls}${furn}${hps}<div style="position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:#9aa0a6">${sc.name}</div></div><div style="font-size:13px;color:#9aa0a6;text-align:center">点击发光点调查</div>`;
}
function clickHP(hid){
  let c=CC2(),sc=c.scenes[G.curSc],h=sc.hotspots.find(x=>x.id===hid);if(!h)return;
  let nw=h.clues.filter(cl=>!hasClue(cl));
  nw.forEach(cl=>{addClue(cl);let cd=c.clues.find(x=>x.id===cl);if(cd)toast(`发现：${cd.n}`)});
  if(nw.length)playSoundEx('unlock');
  let ch=nw.map(cl=>{let cd=c.clues.find(x=>x.id===cl);return cd?`<div class="clue-found">${S('i-key',16)}${cd.n}</div>`:''}).join('');
  if(!nw.length&&!h.clues.length)ch='<p style="color:#9aa0a6;font-size:13px">没有更多发现了。</p>';
  showModal(`${S('i-search',18)} ${h.name}`,`<p>${h.desc}</p>${ch}`,`<button class="modal-btn" onclick="closeModal();render()">确定</button>`);
}

/* Suspects */
function suspectAvClass(s){
  let role=s.role||'',name=s.name||'';
  if(/女|妻|妾|媳|姐|妹|姑|嫂|婶|娘|母|妪|妃|后|仙|娥|嫦|护士|侍女|女仆|丫鬟|女佣/.test(role))return'suspect-av-female';
  if(/婆|爷|奶|翁|老|退休|年迈/.test(role))return'suspect-av-elder';
  if(/[芳丽娟梅兰竹菊莲蓉萍霞玲琴燕莺凤婷娜雪月春秀英玉珠翠红薇莎妮娅]/.test(name))return'suspect-av-female';
  return'suspect-av-male';
}
function rSuspects(c){
  if(G.inter!==null)return rInter(c);
  return c.suspects.map(s=>`<div class="card suspect-card" onclick="G.inter='${s.id}';G.dlgLog=[];if(!G.pressure)G.pressure={};G.pressure['${s.id}']=0;render()">
    <div class="suspect-av ${suspectAvClass(s)}">${S('i-person',26)}</div>
    <div style="flex:1"><div style="font-size:15px;font-weight:600">${s.name}</div><div style="font-size:12px;color:#9aa0a6">${s.role}</div></div>
    ${S('i-arrow-r',18)}
  </div>`).join('');
}
function rInter(c){
  let s=c.suspects.find(x=>x.id===G.inter);if(!s)return'';
  if(!G.dlgLog)G.dlgLog=[];
  if(!G.pressure)G.pressure={};
  let pVal=G.pressure[G.inter]||0;
  let pClass=pVal>=70?'pressure-high':pVal>=40?'pressure-mid':'pressure-low';
  let pressureH=`<div class="pressure-bar"><span class="pressure-label">${S('i-fire',12)} 压力</span><div class="pressure-track"><div class="pressure-fill ${pClass}" style="width:${pVal}%"></div></div><span class="pressure-label">${pVal}%</span></div>`;
  let logH=G.dlgLog.map(d=>`<div class="dlg-bubble"><div class="dlg-speaker">${d.w}</div><div class="dlg-text${d.rev?' reveal':''}${d.con?' contra':''}${d.anim?' dlg-text-animate':''}">${d.t}</div></div>`).join('');
  let qs=s.dlgs.filter((d,i)=>d.q&&(d.req?hasClue(d.req):true)&&(!G.usedQ[G.inter]||!G.usedQ[G.inter].includes(i)));
  let qH=qs.length?qs.map(d=>{
    let ri=s.dlgs.indexOf(d);
    if(d.ev&&!hasClue(d.ev))return'';
    return`<button class="q-btn" onclick="askQ(${ri})">${S('i-chat',16)}${d.q}</button>`;
  }).join(''):'<div style="font-size:13px;color:#9aa0a6;padding:8px">暂无更多问题</div>';
  return`<div style="display:flex;flex-direction:column;height:100%;overflow:hidden">
    <div style="display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #2e3440;flex-shrink:0">
      <div class="suspect-av ${suspectAvClass(s)}">${S('i-person',26)}</div>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">${s.name}</div><div style="font-size:12px;color:#9aa0a6">${s.role}</div></div>
      <button class="back-btn" onclick="G.inter=null;render()">${S('i-arrow-l')}</button>
    </div>
    ${pressureH}
    <div class="dlg-area">${logH}</div>
    <div class="q-area">
      <div style="display:flex;gap:6px;padding:8px 0;flex-shrink:0"><button class="ev-btn" onclick="G.evPick=!G.evPick;render()">${S('i-key',14)}出示证据</button></div>
      <div class="q-list">${qH}</div>
    </div>
    <div class="ev-picker${G.evPick?' show':''}">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #2e3440;flex-shrink:0"><span style="font-size:14px;font-weight:600">选择证据</span><button class="modal-btn" onclick="G.evPick=false;render()">${S('i-close',16)}</button></div>
      <div style="flex:1;overflow-y:auto;padding:10px 14px">${rEvPick(c)}</div>
    </div>
  </div>`;
}
function rEvPick(c){
  return G.clues.filter(cl=>c.clues.find(x=>x.id===cl)).map(cl=>{
    let cd=c.clues.find(x=>x.id===cl);
    return`<div class="ev-item" onclick="presentEv('${cl}')">${S('i-key',18)}<div><div style="font-weight:500">${cd.n}</div></div></div>`;
  }).join('')||'<div style="color:#9aa0a6;font-size:13px;padding:8px">暂无可用证据</div>';
}
function askQ(idx){
  let c=CC2(),s=c.suspects.find(x=>x.id===G.inter),d=s.dlgs[idx];if(!d)return;
  if(!G.usedQ[G.inter])G.usedQ[G.inter]=[];
  G.usedQ[G.inter].push(idx);
  if(!G.pressure)G.pressure={};
  G.pressure[G.inter]=Math.min(100,(G.pressure[G.inter]||0)+12);
  G.dlgLog.push({w:'你',t:d.q});
  let pVal=G.pressure[G.inter];
  let responseText=d.a||d.t;
  if(pVal>=70&&d.c)responseText='……'+responseText;
  G.dlgLog.push({w:s.name,t:responseText,rev:!!(d.r&&d.r.length),con:!!d.c,anim:true});
  if(d.r)d.r.forEach(r=>{if(addClue(r)){let cd=c.clues.find(x=>x.id===r);if(cd)toast(`解锁：${cd.n}`)}});
  playSoundEx('pressure');
  save();render();
  let area=document.querySelector('.dlg-area');if(area)area.scrollTop=area.scrollHeight;
}
function presentEv(clueId){
  G.evPick=false;
  let c=CC2(),s=c.suspects.find(x=>x.id===G.inter);
  if(!G.pressure)G.pressure={};
  G.pressure[G.inter]=Math.min(100,(G.pressure[G.inter]||0)+18);
  let m=s.dlgs.find((d,i)=>d.ev===clueId&&(!G.usedQ[G.inter]||!G.usedQ[G.inter].includes(i)));
  if(m){G.dlgLog.push({w:'你',t:`（出示：${c.clues.find(x=>x.id===clueId)?.n}）`});askQ(s.dlgs.indexOf(m));}
  else{G.dlgLog.push({w:'你',t:`（出示：${c.clues.find(x=>x.id===clueId)?.n}）`});G.dlgLog.push({w:s.name,t:'这和我的供述没有关系。'});toast('证据不相关','warn');save();render();}
}

/* Timeline */
function rTimeline(c){
  let tl=c.timeline,pl=G.tlPlace[c.id]||{};
  let sorted=tl.events.slice().sort((a,b)=>a.order-b.order);
  let slots=sorted.map(ev=>{
    let pid=pl[ev.order],ok=pid===ev.id,pev=pid?tl.events.find(e=>e.id===pid):null;
    return`<div class="tl-slot"><div class="tl-dot${pid?(ok?' filled':' wrong'):''}"></div><div class="tl-time">${ev.time}</div>${pev?`<div class="tl-filled" onclick="rmTL(${ev.order})">${pev.text}</div>`:`<div class="tl-empty" onclick="selTL(${ev.order})">点击放置事件</div>`}</div>`;
  }).join('');
  let pool=tl.events.filter(e=>!Object.values(pl).includes(e.id));
  let poolH=pool.map(e=>`<div class="pool-item${G.selPool===e.id?' sel':''}" onclick="G.selPool='${e.id}';render()">${e.text}（${e.time}）</div>`).join('');
  let allDone=Object.keys(pl).length===tl.events.length;
  return`<div class="tl-track"><div class="tl-line"></div>${slots}</div><div class="tl-pool"><div style="font-size:12px;color:#9aa0a6;margin-bottom:8px">${S('i-clock',14)} 待放置事件</div>${poolH||'<div style="color:#9aa0a6;font-size:12px">全部已放置</div>'}</div>${allDone?`<button class="check-btn" onclick="checkTL()">确认时间线</button>`:''}`;
}
function selTL(order){if(!G.selPool)return toast('先选择下方事件','warn');if(!G.tlPlace[CC2().id])G.tlPlace[CC2().id]={};G.tlPlace[CC2().id][order]=G.selPool;G.selPool=null;save();render();}
function rmTL(order){if(G.tlPlace[CC2().id]){delete G.tlPlace[CC2().id][order];save();render();}}
function checkTL(){let c=CC2(),pl=G.tlPlace[c.id]||{};if(c.timeline.events.every(e=>pl[e.order]===e.id))toast('时间线正确！','ok');else toast('有误，检查标红位置','warn');}

/* Clues */
function rClues(c){
  let flt=G.clueFilter,cats=['全部','物证','口供','文件','推理'];
  let fl=flt==='全部'?G.clues:G.clues.filter(cl=>{let cd=c.clues.find(x=>x.id===cl);return cd&&cd.cat===flt});
  let fltH=cats.map(cat=>`<button class="clue-filter${flt===cat?' active':''}" onclick="G.clueFilter='${cat}';render()">${cat}</button>`).join('');
  let availSynth=c.synthesis?c.synthesis.filter(sy=>!G.synthDone.includes(sy.input.slice().sort().join(','))):[];
  let cards=fl.map(cl=>{let cd=c.clues.find(x=>x.id===cl);if(!cd)return'';
    let canSynth=availSynth.filter(sy=>sy.input.includes(cl));
    let hintH=canSynth.length>0?`<div class="clue-synth-badge">${S('i-bulb',10)} 可合成 ${canSynth.length} 组</div>`:'';
    let glowClass=canSynth.length>0?' clue-hint-glow':'';
    return`<div class="card${glowClass}" style="padding:12px"><div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span class="badge ${CC[cd.cat]||'badge-ev'}">${cd.cat}</span><span style="font-size:14px;font-weight:600;flex:1">${cd.n}</span></div><div style="font-size:13px;color:#9aa0a6;line-height:1.5">${cd.d}</div>${hintH}</div>`;
  }).join('');
  let synth=rSynth(c);
  return`<div class="clue-filters">${fltH}</div>${cards||'<div class="empty-state">'+S('i-clipboard',42)+'<div>暂无线索</div></div>'}<div class="divider"></div><div style="font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px">${S('i-plus',16)}线索合成</div>${synth}`;
}
function rSynth(c){
  if(!c.synthesis)return'';
  let s0=G.selSynth[1],s1=G.selSynth[2];
  let avail=c.synthesis.filter(sy=>!G.synthDone.includes(sy.input.slice().sort().join(',')));
  let cls=G.clues.filter(cl=>c.clues.find(x=>x.id===cl));
  let slotH=idx=>{let sel=idx===1?s0:s1;if(sel){let cd=c.clues.find(x=>x.id===sel);return cd?`<div style="font-size:12px;font-weight:500">${cd.n}</div>`:''}return'<div style="color:#9aa0a6;font-size:11px">选择线索</div>'};
  let poolH=cls.map(cl=>{let cd=c.clues.find(x=>x.id===cl);let used=(s0===cl||s1===cl);return`<div class="pool-item${used?' sel':''}" style="padding:8px 10px;font-size:12px;margin-bottom:4px" onclick="pickSy(${G.synthSlot},'${cl}')">${cd.n}</div>`}).join('');
  let resH='';
  if(s0&&s1){
    let recipe=avail.find(sy=>{let inp=sy.input.slice().sort(),sel=[s0,s1].sort();return inp[0]===sel[0]&&inp[1]===sel[1]});
    if(recipe)resH=`<div class="synth-result" onclick="doSynth('${recipe.input.slice().sort().join(',')}','${recipe.output}')"><div><div style="font-weight:600;margin-bottom:4px">${S('i-bulb',16)} 点击合成</div></div></div>`;
    else if(G.synthDone.find(d=>{let inp=d.split(',');return inp.includes(s0)&&inp.includes(s1)}))resH=`<div class="synth-result" style="border-color:#2e3440;color:#9aa0a6">已合成过</div>`;
    else resH=`<div class="synth-result" style="border-color:rgba(192,57,43,.3);color:#c0392b">无法合成</div>`;
  }
  return`<div class="synth-wrap"><div class="synth-slots"><div class="synth-slot${s0?' filled':''}" onclick="G.synthSlot=1;render()">${slotH(1)}</div><div style="font-size:20px;color:#d4a017;font-weight:700">+</div><div class="synth-slot${s1?' filled':''}" onclick="G.synthSlot=2;render()">${slotH(2)}</div></div><div style="font-size:20px;color:#9aa0a6;font-weight:700">=</div>${resH||'<div class="synth-result" style="border-color:#2e3440;color:#9aa0a6">选择两条线索合成</div>'}<div style="width:100%;margin-top:8px"><div style="font-size:12px;color:#9aa0a6;margin-bottom:6px">选择线索：</div>${poolH}</div></div>`;
}
function pickSy(slot,cl){G.selSynth[slot]=cl;render()}
function doSynth(key,output){G.synthDone.push(key);addClue(output);let cd=CC2().clues.find(x=>x.id===output);if(cd)toast(`合成：${cd.n}`,'ok');G.selSynth=[0,null,null];save();render();}

/* Accuse */
function rAccuse(c){
  if(!G.accSt||!G.accSt.evidence)G.accSt={suspect:null,evidence:[]};
  let as=G.accSt;
  let susH=c.suspects.map(s=>`<div class="acc-suspect${as.suspect===s.id?' selected':''}" onclick="G.accSt.suspect='${s.id}';render()"><div class="suspect-av" style="width:40px;height:40px">${S('i-person',22)}</div><div style="flex:1"><div style="font-size:14px;font-weight:600">${s.name}</div><div style="font-size:12px;color:#9aa0a6">${s.role}</div></div></div>`).join('');
  let evH=G.clues.filter(cl=>c.clues.find(x=>x.id===cl)).map(cl=>{let cd=c.clues.find(x=>x.id===cl),sel=as.evidence.includes(cl);
    return`<div class="acc-ev${sel?' selected':''}" onclick="togAccEv('${cl}')"><div class="chk">${sel?S('i-check',14):''}</div><div style="flex:1;font-size:13px;font-weight:500">${cd.n}</div></div>`;
  }).join('');
  let ready=as.suspect&&as.evidence.length>=2;
  // If in twist phase, show contradictions
  let contraH='';
  if(G.twist&&c.twist){
    let found=G.revFound[c.id]||[];
    contraH=`<div class="divider"></div><div style="font-size:14px;font-weight:600;color:#8e44ad;margin-bottom:8px">${S('i-exclaim',16)} 矛盾点 (${found.length}/${c.twist.contras.length})</div>`;
    contraH+=c.twist.contras.map((ct,i)=>{
      let isFound=found.includes(i);
      return`<div class="contra-card${isFound?' found':''}" onclick="findContra(${i})"><div style="font-size:13px;line-height:1.6">${ct.text}</div>${isFound?`<div style="font-size:12px;color:#27ae60;margin-top:4px">已发现</div>`:''}</div>`;
    }).join('');
    let allFound=found.length>=c.twist.contras.length;
    if(allFound)contraH+=`<button class="submit-btn ready" style="margin-top:12px" onclick="trueEnding()">揭示真相</button>`;
  }
  return`<div style="font-size:14px;font-weight:600;color:#d4a017;margin-bottom:8px">${S('i-gavel',16)}选择嫌疑人</div>${susH}<div class="divider"></div><div style="font-size:14px;font-weight:600;color:#d4a017;margin-bottom:8px">${S('i-key',16)}选择关键证据（至少2条）</div>${evH}${!G.twist?`<button class="submit-btn ${ready?'ready':'not-ready'}" onclick="submitAcc()">提交指认</button>`:''}${contraH}`;
}
function togAccEv(cl){let as=G.accSt,i=as.evidence.indexOf(cl);if(i>=0)as.evidence.splice(i,1);else if(as.evidence.length<3)as.evidence.push(cl);render();}
function submitAcc(){
  let c=CC2(),as=G.accSt;if(!as.suspect||as.evidence.length<2)return;
  G.twist=true;save();
  showTwist(c.twist.text,()=>{G.tab='accuse';save();render();toast('卷宗重审模式','twist');});
}
function findContra(idx){
  let c=CC2();if(!G.revFound[c.id])G.revFound[c.id]=[];
  if(!G.revFound[c.id].includes(idx)){G.revFound[c.id].push(idx);let ct=c.twist.contras[idx];if(ct.ev&&addClue(ct.ev)){let cd=c.clues.find(x=>x.id===ct.ev);if(cd)toast(`发现：${cd.n}`,'ok');}save();render();}
}
function trueEnding(){
  let c=CC2(),as=G.accSt;
  let perfect=as.suspect===c.accusation.suspect&&c.accusation.evidence.every(e=>as.evidence.includes(e))&&G.hints===0;
  let trueEnd=as.suspect===c.accusation.suspect;
  G.endType=perfect?'perfect':trueEnd?'true_end':'surface';
  G.stars[c.id]=Math.max(G.stars[c.id]||0,c.endings[G.endType].stars);
  unlockAch(c.id+'_clear');
  if(G.stars[c.id]>=3)unlockAch(c.id+'_perfect');
  if(CASES.every(cs=>G.stars[cs.id]>0))unlockAch('all_clear');
  if(CASES.every(cs=>G.stars[cs.id]>=3))unlockAch('all_perfect');
  if(!G.stats)G.stats={totalTime:0,totalClues:0,perfectCount:0,clearCount:0,sessionStart:Date.now()};
  G.stats.totalTime=Math.floor((Date.now()-G.stats.sessionStart)/1000)+(G.stats._accumulated||0);
  G.stats._accumulated=G.stats.totalTime;
  G.stats.totalClues+=G.clues.length;
  if(perfect)G.stats.perfectCount++;
  G.stats.clearCount++;
  save();G.screen='ending';render();
}

/* Ending */
function rEnd(){
  let c=CC2(),end=c.endings[G.endType];
  let starsH=[1,2,3].map(n=>`<span class="${n<=end.stars?'star-f end-star-anim':'star-e'}">${S('i-star-f',36)}</span>`).join('');
  let reviewH='';
  if(G.endType==='perfect'||G.endType==='true_end'){
    let susName=c.suspects.find(s=>s.id===c.accusation.suspect)?.name||'未知';
    let evNames=c.accusation.evidence.map(eid=>c.clues.find(cl=>cl.id===eid)?.n||'').filter(Boolean);
    reviewH=`<div style="font-size:13px;color:#9aa0a6;margin-bottom:16px;text-align:left;width:100%;max-width:380px">
      <div style="font-size:14px;font-weight:600;color:#d4a017;margin-bottom:8px">${S('i-bulb',16)} 推理回顾</div>
      <div style="background:#1e222b;padding:12px;border-radius:10px;border:1px solid #2e3440;line-height:1.7">
        <div style="margin-bottom:6px"><strong>凶手：</strong>${susName}</div>
        <div style="margin-bottom:6px"><strong>关键证据：</strong>${evNames.join('、')}</div>
        <div><strong>推理过程：</strong>${c.accusation.summary||end.desc}</div>
      </div>
    </div>`;
  }
  app.innerHTML=`<div class="screen active end-screen">
    <div class="end-stars">${starsH}</div>
    <div class="end-title-anim" style="font-size:22px;font-weight:700;margin-bottom:6px">${end.title}</div>
    <div class="end-title-anim" style="font-size:13px;color:#9aa0a6;margin-bottom:20px;animation-delay:.6s">${c.name} · ${end.stars}星结局</div>
    <div class="end-desc-anim" style="font-size:14px;line-height:1.7;color:#9aa0a6;margin-bottom:24px;text-align:left;background:#1e222b;padding:14px;border-radius:10px;border:1px solid #2e3440;max-height:180px;overflow-y:auto">${end.desc}</div>
    ${reviewH}
    <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px">
      <button class="menu-btn btn-p" onclick="shareResult()">分享推理报告</button>
      <button class="menu-btn btn-s" onclick="G.screen='cases';render()">返回案件列表</button>
      <button class="menu-btn btn-s" onclick="selCase(${G.ci})">重新调查</button>
      <button class="menu-btn btn-g" onclick="G.screen='menu';render()">主菜单</button>
    </div>
  </div>`;
}

/* Achievements */
function rAch(){
  let achs=[
    {id:'c1_clear',n:'雨夜初晴',d:'通关案件001'},
    {id:'c1_perfect',n:'完美推理',d:'三星通关案件001'},
    {id:'c2_clear',n:'密室破译',d:'通关案件002'},
    {id:'c2_perfect',n:'完美推理',d:'三星通关案件002'},
    {id:'c3_clear',n:'列车迷踪',d:'通关案件003'},
    {id:'c3_perfect',n:'完美推理',d:'三星通关案件003'},
    {id:'c4_clear',n:'校园疑云',d:'通关案件004'},
    {id:'c4_perfect',n:'完美推理',d:'三星通关案件004'},
    {id:'c5_clear',n:'白衣天使',d:'通关案件005'},
    {id:'c5_perfect',n:'完美推理',d:'三星通关案件005'},
    {id:'c6_clear',n:'密室盗宝',d:'通关案件006'},
    {id:'c6_perfect',n:'完美推理',d:'三星通关案件006'},
    {id:'c7_clear',n:'剧院魅影',d:'通关案件007'},
    {id:'c7_perfect',n:'完美推理',d:'三星通关案件007'},
    {id:'c8_clear',n:'古宅惊魂',d:'通关案件008'},
    {id:'c8_perfect',n:'完美推理',d:'三星通关案件008'},
    {id:'c9_clear',n:'游轮迷案',d:'通关案件009'},
    {id:'c9_perfect',n:'完美推理',d:'三星通关案件009'},
    {id:'c10_clear',n:'终极对决',d:'通关案件010'},
    {id:'c10_perfect',n:'完美推理',d:'三星通关案件010'},
    {id:'all_clear',n:'大侦探',d:'通关全部案件'},
    {id:'all_perfect',n:'传奇侦探',d:'全部三星通关'}
  ];
  let h=`<div class="screen active"><div class="top-bar"><button class="back-btn" onclick="G.screen='menu';render()">${S('i-arrow-l')}</button><span class="bar-title">成就</span></div><div class="content">`;
  let unlocked=achs.filter(a=>G.ach[a.id]).length;
  h+=`<div style="padding:14px;text-align:center;font-size:13px;color:#9aa0a6;margin-bottom:8px">已解锁 ${unlocked}/${achs.length}</div>`;
  achs.forEach(a=>{
    let u=G.ach[a.id];
    h+=`<div class="card ach-card ${u?'unlocked':'locked'}"><div class="ach-icon" style="color:${u?'#d4a017':'#9aa0a6'}">${S(u?'i-trophy':'i-shield',22)}</div><div><div style="font-size:14px;font-weight:600">${a.n}</div><div style="font-size:12px;color:#9aa0a6">${a.d}</div></div></div>`;
  });
  h+=`</div></div>`;app.innerHTML=h;
}
function unlockAch(id){if(!G.ach[id]){G.ach[id]=true;save();toast('成就解锁！','ok');}}

function shareResult(){
  let c=CC2(),end=c.endings[G.endType];
  let susName=c.suspects.find(s=>s.id===c.accusation.suspect)?.name||'未知';
  let evNames=c.accusation.evidence.map(eid=>c.clues.find(cl=>cl.id===eid)?.n||'').filter(Boolean);
  let text=`【疑案手札】${c.name}\n结局：${end.title}（${end.stars}星）\n凶手：${susName}\n关键证据：${evNames.join('、')}\n推理：${c.accusation.summary||end.desc}\n\n你以为找到了真相，但真相不止一层。`;
  if(navigator.share){
    navigator.share({title:'疑案手札',text:text}).catch(()=>{});
  }else{
    let body=`<div class="share-card"><div class="share-card-title">${c.name} · ${end.title}</div><div class="share-card-body"><div style="margin-bottom:8px"><strong>凶手：</strong>${susName}</div><div style="margin-bottom:8px"><strong>证据：</strong>${evNames.join('、')}</div><div><strong>推理：</strong>${c.accusation.summary||end.desc}</div></div></div>`;
    showModal('推理报告',body,`<button class="menu-btn btn-s" onclick="copyText(\`${text.replace(/`/g,'\\`')}\`);closeModal()">复制文本</button>`);
  }
}
function copyText(t){
  navigator.clipboard.writeText(t).then(()=>toast('已复制到剪贴板','ok')).catch(()=>toast('复制失败','warn'));
}

function showConfirm(msg,yesCb){
  document.getElementById('confirm-msg').textContent=msg;
  document.getElementById('confirm-yes').onclick=()=>{document.getElementById('confirm-ov').classList.remove('show');yesCb();};
  document.getElementById('confirm-ov').classList.add('show');
}

function fmtTime(s){
  let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  return h>0?`${h}时${m}分`:(m>0?`${m}分${sec}秒`:`${sec}秒`);
}

function showStats(){
  if(!G.stats)G.stats={totalTime:0,totalClues:0,perfectCount:0,clearCount:0,sessionStart:Date.now()};
  let t=Math.floor((Date.now()-G.stats.sessionStart)/1000)+(G.stats._accumulated||0);
  let perfectRate=G.stats.clearCount>0?Math.round(G.stats.perfectCount/G.stats.clearCount*100):0;
  let body=`
    <div class="stat-bar"><span class="stat-bar-label">游戏时长</span><span class="stat-bar-value">${fmtTime(t)}</span></div>
    <div class="stat-bar"><span class="stat-bar-label">收集线索</span><span class="stat-bar-value">${G.stats.totalClues} 条</span></div>
    <div class="stat-bar"><span class="stat-bar-label">通关案件</span><span class="stat-bar-value">${G.stats.clearCount} / ${CASES.length}</span></div>
    <div class="stat-bar"><span class="stat-bar-label">完美通关</span><span class="stat-bar-value">${G.stats.perfectCount} 次</span></div>
    <div class="stat-bar"><span class="stat-bar-label">完美率</span><span class="stat-bar-value">${perfectRate}%</span></div>
  `;
  showModal('游戏统计',body,`<button class="modal-btn" onclick="closeModal()">确定</button>`);
}

/* Init */
loadSettings();
if(!G.stats)G.stats={totalTime:0,totalClues:0,perfectCount:0,clearCount:0,sessionStart:Date.now(),_accumulated:0};
G.stats.sessionStart=Date.now();
render();
window.addEventListener('beforeunload',()=>{if(G.screen==='game')save();});
history.pushState(null,null,location.href);
window.addEventListener('popstate',()=>{
  if(G.screen==='game'){showConfirm('确定要离开当前案件吗？',()=>{G.screen='cases';render();});history.pushState(null,null,location.href);}
  else if(G.screen==='cases'){G.screen='menu';render();history.pushState(null,null,location.href);}
  else if(G.screen==='ach'){G.screen='menu';render();history.pushState(null,null,location.href);}
});
</script>
</body>
