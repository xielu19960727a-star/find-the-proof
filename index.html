<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>疑案手札</title>
<!-- PWA & Bookmark Icons -->
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="疑案手札">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;color:#e8e6e3;background:#0f1115}
body{display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;position:relative;background:linear-gradient(180deg,#0f1115,#1a1d24);overflow:hidden}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#2e3440;border-radius:3px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}.screen.active{display:flex;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes cardPulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 20px rgba(212,160,23,.3)}}
@keyframes hpPulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.3);opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(-16px)}}
@keyframes tPulse{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(2.5);opacity:.7}}
.top-bar{display:flex;align-items:center;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(15,17,21,.95);border-bottom:1px solid #2e3440;min-height:48px;gap:10px;flex-shrink:0;z-index:10}
.back-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#9aa0a6;flex-shrink:0;border-radius:50%}
.back-btn:active{background:#2e3440}
.bar-title{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-status{display:flex;align-items:center;gap:10px;font-size:12px;color:#9aa0a6;flex-shrink:0}
.insight{color:#d4a017;display:flex;align-items:center;gap:3px}
.bottom-nav{display:flex;background:rgba(15,17,21,.97);border-top:1px solid #2e3440;padding-bottom:env(safe-area-inset-bottom,0px);flex-shrink:0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;min-height:52px;color:#9aa0a6;font-size:10px;gap:2px;transition:color .2s;position:relative}
.nav-item.active{color:#d4a017}.nav-item.active::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;background:#d4a017;border-radius:0 0 2px 2px}
.nav-item svg{width:20px;height:20px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px;min-height:0}
.card{background:#1e222b;border:1px solid #2e3440;border-radius:12px;padding:14px;margin-bottom:10px;transition:transform .15s}
.card:active{transform:scale(.97)}
.card.highlight{animation:cardPulse .6s ease}
.badge{display:inline-flex;padding:2px 7px;border-radius:8px;font-size:11px;font-weight:500}
.badge-ev{background:rgba(212,160,23,.15);color:#d4a017}.badge-te{background:rgba(142,68,173,.15);color:#8e44ad}
.badge-do{background:rgba(52,152,219,.15);color:#3498db}.badge-re{background:rgba(192,57,43,.15);color:#c0392b}
.menu-screen{justify-content:center;align-items:center;padding:32px;text-align:center}
.menu-title{font-size:28px;font-weight:700;letter-spacing:4px;margin-bottom:6px}
.menu-sub{font-size:13px;color:#9aa0a6;letter-spacing:2px;margin-bottom:40px}
.menu-btn{display:block;width:100%;max-width:260px;padding:13px 20px;margin:0 auto 10px;border-radius:12px;font-size:15px;font-weight:600;transition:all .15s}
.menu-btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,#c0392b,#a93226);color:#fff}
.btn-s{background:#1e222b;border:1px solid #2e3440;color:#e8e6e3}
.btn-g{background:transparent;color:#9aa0a6}
.scene-wrap{position:relative;width:100%;aspect-ratio:3/4;max-height:52vh;background:#161920;border:1px solid #2e3440;border-radius:12px;overflow:hidden;margin-bottom:12px}
.sc-wall{position:absolute;background:#2e3440;border-radius:2px}
.sc-furn{position:absolute;background:#252a35;border:1px solid #353b48;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#9aa0a6;z-index:1;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.hotspot{position:absolute;width:56px;height:56px;transform:translate(-50%,-50%);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;z-index:2}
.hotspot>svg{width:20px;height:20px;color:#d4a017;filter:drop-shadow(0 0 3px rgba(212,160,23,.5))}
.hotspot::before{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid rgba(212,160,23,.7);box-shadow:0 0 12px rgba(212,160,23,.35),inset 0 0 12px rgba(212,160,23,.12)}
.hotspot::after{display:none}
.hp-label{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;font-size:10px;color:#d4a017;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none}
.hotspot.done::before{border-color:rgba(39,174,96,.6);box-shadow:0 0 10px rgba(39,174,96,.25),inset 0 0 10px rgba(39,174,96,.1)}.hotspot.done>svg{color:#27ae60;filter:drop-shadow(0 0 3px rgba(39,174,96,.5))}.hotspot.done .hp-label{color:#27ae60}
.hotspot.hidden{display:none}
.scene-tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px}
.scene-tab{padding:7px 14px;border-radius:18px;font-size:12px;white-space:nowrap;background:#1e222b;border:1px solid #2e3440;color:#9aa0a6;flex-shrink:0}
.scene-tab.active{background:rgba(212,160,23,.15);border-color:#d4a017;color:#d4a017}
.suspect-card{display:flex;align-items:center;gap:12px;cursor:pointer}
.suspect-av{width:48px;height:48px;border-radius:50%;background:#252a35;border:2px solid #2e3440;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dlg-area{flex:1;overflow-y:auto;padding:14px;min-height:0}
.dlg-bubble{margin-bottom:12px;animation:fadeIn .3s ease}
.dlg-speaker{font-size:12px;font-weight:600;margin-bottom:3px;color:#d4a017}
.dlg-text{font-size:14px;line-height:1.7;background:#252a35;padding:10px 14px;border-radius:10px;border-top-left-radius:3px}
.dlg-text.reveal{border-left:3px solid #8e44ad;background:rgba(142,68,173,.08)}
.dlg-text.contra{border-left:3px solid #c0392b;background:rgba(192,57,43,.08)}
.q-area{padding:10px 14px;border-top:1px solid #2e3440;flex-shrink:0;max-height:40%;overflow-y:auto}
.q-list{display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.q-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;background:#252a35;border-radius:9px;font-size:13px;text-align:left;transition:all .15s}
.q-btn:active{transform:scale(.97)}.q-btn.used{opacity:.35;pointer-events:none}
.ev-btn{display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:18px;font-size:12px;font-weight:600;background:rgba(192,57,43,.15);color:#c0392b;border:1px solid rgba(192,57,43,.3)}
.ev-picker{position:absolute;bottom:0;left:0;right:0;max-height:50%;background:#1a1d24;border-top:1px solid #2e3440;border-radius:14px 14px 0 0;z-index:20;transform:translateY(100%);transition:transform .3s;display:flex;flex-direction:column;overflow:hidden}
.ev-picker.show{transform:translateY(0)}
.ev-item{display:flex;align-items:center;gap:8px;padding:10px;background:#252a35;border-radius:9px;margin-bottom:6px;cursor:pointer;font-size:13px}
.ev-item:active{transform:scale(.97)}
.tl-track{position:relative;padding:16px 0 16px 36px}
.tl-line{position:absolute;left:16px;top:0;bottom:0;width:2px;background:#2e3440}
.tl-slot{position:relative;margin-bottom:18px;min-height:40px}
.tl-dot{position:absolute;left:-27px;top:3px;width:14px;height:14px;border-radius:50%;border:2px solid #2e3440;background:#1a1d24;z-index:1}
.tl-dot.filled{border-color:#d4a017;background:#d4a017}.tl-dot.wrong{border-color:#c0392b;background:#c0392b}
.tl-time{font-size:11px;color:#d4a017;margin-bottom:3px;font-weight:600}
.tl-empty{padding:10px 12px;background:#252a35;border:1px dashed #2e3440;border-radius:9px;font-size:12px;color:#9aa0a6;cursor:pointer}
.tl-filled{padding:10px 12px;background:rgba(212,160,23,.1);border:1px solid rgba(212,160,23,.3);border-radius:9px;font-size:12px;cursor:pointer}
.tl-pool{margin-top:14px;padding-top:12px;border-top:1px solid #2e3440}
.pool-item{padding:10px 12px;background:#252a35;border:1px solid #2e3440;border-radius:9px;font-size:12px;margin-bottom:6px;cursor:pointer}
.pool-item:active{transform:scale(.97)}.pool-item.sel{border-color:#d4a017;background:rgba(212,160,23,.1)}.pool-item.placed{opacity:.3;pointer-events:none}
.check-btn{display:block;margin:14px auto 0;padding:11px 28px;border-radius:11px;font-size:14px;font-weight:600;background:linear-gradient(135deg,#d4a017,#b8860b);color:#0f1115}
.check-btn:disabled{opacity:.35;pointer-events:none}
.clue-filters{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.clue-filter{padding:5px 12px;border-radius:14px;font-size:12px;white-space:nowrap;background:#1e222b;border:1px solid #2e3440;color:#9aa0a6;flex-shrink:0}
.clue-filter.active{background:rgba(212,160,23,.15);border-color:#d4a017;color:#d4a017}
.synth-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0}
.synth-slots{display:flex;align-items:center;gap:10px;width:100%}
.synth-slot{flex:1;min-height:64px;background:#252a35;border:1px dashed #2e3440;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;cursor:pointer;font-size:12px}
.synth-slot.filled{border-style:solid;border-color:#d4a017;background:rgba(212,160,23,.08)}
.synth-result{width:100%;min-height:64px;background:rgba(39,174,96,.08);border:1px solid rgba(39,174,96,.3);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;font-size:13px;color:#27ae60;cursor:pointer}
.acc-suspect{display:flex;align-items:center;gap:10px;padding:12px;background:#252a35;border:2px solid #2e3440;border-radius:10px;margin-bottom:6px;cursor:pointer;transition:all .15s}
.acc-suspect:active{transform:scale(.97)}.acc-suspect.selected{border-color:#c0392b;background:rgba(192,57,43,.08)}
.acc-ev{display:flex;align-items:center;gap:8px;padding:10px;background:#252a35;border:2px solid #2e3440;border-radius:9px;margin-bottom:6px;cursor:pointer;font-size:13px}
.acc-ev:active{transform:scale(.97)}.acc-ev.selected{border-color:#d4a017;background:rgba(212,160,23,.08)}
.chk{width:20px;height:20px;border-radius:50%;border:2px solid #2e3440;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acc-ev.selected .chk{border-color:#d4a017;background:#d4a017;color:#0f1115}
.submit-btn{display:block;width:100%;padding:13px;border-radius:11px;font-size:15px;font-weight:700;text-align:center;margin-top:14px}
.submit-btn.ready{background:linear-gradient(135deg,#c0392b,#a93226);color:#fff}
.submit-btn.not-ready{background:#252a35;color:#9aa0a6;pointer-events:none}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal-ov.show{display:flex}
.modal{background:#1e222b;border:1px solid #2e3440;border-radius:14px;width:100%;max-width:380px;max-height:80vh;overflow-y:auto;animation:fadeIn .3s;margin:auto}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid #2e3440}
.modal-body{padding:14px}.modal-body p{font-size:14px;line-height:1.7;margin-bottom:10px}
.clue-found{display:flex;align-items:center;gap:6px;padding:9px 12px;background:rgba(212,160,23,.1);border:1px solid rgba(212,160,23,.2);border-radius:9px;margin-top:6px;font-size:13px;color:#d4a017;animation:cardPulse .6s}
.modal-ftr{padding:10px 14px;border-top:1px solid #2e3440;display:flex;justify-content:flex-end}
.modal-btn{padding:9px 20px;border-radius:9px;font-size:13px;font-weight:600;background:rgba(212,160,23,.15);color:#d4a017}
#toasts{position:fixed;top:calc(60px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;pointer-events:none;width:88%;max-width:380px}
.toast{padding:10px 16px;border-radius:9px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;animation:toastIn .3s;pointer-events:auto}
.toast.hiding{animation:toastOut .3s forwards}
.toast-clue{background:rgba(212,160,23,.15);border:1px solid rgba(212,160,23,.3);color:#d4a017}
.toast-twist{background:rgba(142,68,173,.2);border:1px solid rgba(142,68,173,.4);color:#8e44ad}
.toast-ok{background:rgba(39,174,96,.15);border:1px solid rgba(39,174,96,.3);color:#27ae60}
.toast-warn{background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.3);color:#c0392b}
.twist-ov{position:fixed;inset:0;background:#0a0b0e;z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;padding:28px;text-align:center}
.twist-ov.show{display:flex}
.twist-pulse{position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(142,68,173,.3),transparent);animation:tPulse 2s infinite}
.twist-text{font-size:18px;font-weight:600;color:#8e44ad;line-height:1.8;z-index:1;min-height:80px;display:flex;align-items:center;justify-content:center}
.twist-skip{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));font-size:13px;color:#9aa0a6;z-index:1}
.end-screen{justify-content:center;align-items:center;padding:28px;text-align:center}
.end-stars{display:flex;gap:6px;margin-bottom:20px}
.end-stars svg{width:36px;height:36px}
.star-f{color:#d4a017}.star-e{color:#2e3440}
.review-banner{background:rgba(142,68,173,.1);border:1px solid rgba(142,68,173,.3);border-radius:9px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:13px;color:#8e44ad}
.contra-card{border-left:3px solid #8e44ad;cursor:pointer;margin-bottom:8px;padding:12px;background:#1e222b;border-radius:0 10px 10px 0}
.contra-card.found{border-left-color:#27ae60;background:rgba(39,174,96,.05)}
.ach-card{display:flex;align-items:center;gap:10px;padding:12px}
.ach-card.unlocked{border-color:rgba(212,160,23,.3)}.ach-card.locked{opacity:.45}
.ach-icon{width:40px;height:40px;border-radius:50%;background:#252a35;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.empty-state{display:flex;flex-direction:column;align-items:center;padding:36px 16px;color:#9aa0a6;text-align:center;gap:10px}
.empty-state svg{width:42px;height:42px;opacity:.3}
.text-muted{color:#9aa0a6}.text-accent{color:#d4a017}.text-danger{color:#c0392b}.text-twist{color:#8e44ad}.text-ok{color:#27ae60}
.divider{height:1px;background:#2e3440;margin:12px 0}
.settings-toggle{display:flex;align-items:center;justify-content:space-between;padding:14px;background:#252a35;border-radius:10px;margin-bottom:10px}
.settings-toggle-label{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500}
.toggle-switch{position:relative;width:48px;height:26px;background:#2e3440;border-radius:13px;cursor:pointer;transition:background .2s}
.toggle-switch.active{background:#d4a017}
.toggle-switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle-switch.active::after{transform:translateX(22px)}
.save-slot{padding:14px;background:#252a35;border:1px solid #2e3440;border-radius:10px;margin-bottom:10px;cursor:pointer;transition:all .15s}
.save-slot:active{transform:scale(.97)}
.save-slot.has-data{border-color:rgba(212,160,23,.3)}
.save-slot-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.save-slot-title{font-size:14px;font-weight:600}
.save-slot-empty{color:#9aa0a6;font-size:13px}
.save-slot-info{display:flex;gap:12px;font-size:12px;color:#9aa0a6}
.settings-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#9aa0a6;border-radius:50%;flex-shrink:0}
.settings-btn:active{background:#2e3440}
.hint-btn{display:flex;align-items:center;gap:4px;padding:4px 10px;background:rgba(212,160,23,.15);border-radius:14px;font-size:12px;font-weight:600;color:#d4a017}
.hint-btn:active{background:rgba(212,160,23,.25)}
.content-inner{animation:contentFade .35s ease}
@keyframes contentFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sc-wall{background:linear-gradient(135deg,#2e3440,#353b48)}
.sc-furn{background:linear-gradient(180deg,#252a35,#1e222b);border-color:#3a4050}
.scene-wrap{background:linear-gradient(180deg,#161920,#1a1d24)}
.hotspot{transition:transform .15s}.hotspot:active{transform:translate(-50%,-50%) scale(1.2)}
.dlg-text-animate{overflow:hidden;animation:dlgReveal .5s ease}
@keyframes dlgReveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stat-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#252a35;border-radius:10px;margin-bottom:8px}
.stat-bar-label{font-size:12px;color:#9aa0a6;flex:1}.stat-bar-value{font-size:14px;font-weight:600;color:#d4a017}
.case-progress{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:#9aa0a6}
.case-progress-bar{flex:1;height:4px;background:#2e3440;border-radius:2px;overflow:hidden}
.case-progress-fill{height:100%;background:#d4a017;border-radius:2px;transition:width .3s}
.end-badge{display:inline-flex;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.end-badge-surface{background:rgba(142,68,173,.15);color:#8e44ad}
.end-badge-true{background:rgba(212,160,23,.15);color:#d4a017}
.end-badge-perfect{background:rgba(39,174,96,.15);color:#27ae60}
.confirm-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.confirm-ov.show{display:flex}
.confirm-box{background:#1e222b;border:1px solid #2e3440;border-radius:14px;padding:20px;text-align:center;max-width:300px;animation:fadeIn .2s}
.confirm-box p{font-size:14px;margin-bottom:16px;line-height:1.6}
.confirm-btns{display:flex;gap:10px;justify-content:center}
.confirm-btns button{padding:8px 20px;border-radius:9px;font-size:13px;font-weight:600}
.confirm-yes{background:rgba(192,57,43,.2);color:#c0392b}
.confirm-no{background:#252a35;color:#e8e6e3}
.share-card{background:#1e222b;border:1px solid #2e3440;border-radius:12px;padding:16px;margin-top:12px}
.share-card-title{font-size:15px;font-weight:700;color:#d4a017;margin-bottom:8px}
.share-card-body{font-size:13px;color:#9aa0a6;line-height:1.7}
.hotspot:not(.done):not(.hidden){animation:hpPulse 2s ease-in-out infinite}
@keyframes hpPulse{0%,100%{box-shadow:0 0 0 0 rgba(212,160,23,.25)}50%{box-shadow:0 0 0 12px rgba(212,160,23,0)}}
.menu-btn{transition:transform .15s}.menu-btn:active{transform:scale(.96)}
.card{transition:border-color .2s}
/* === Atmosphere Particles === */
.atmo-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.atmo-rain{position:absolute;width:2px;background:linear-gradient(180deg,transparent,rgba(120,160,200,.5));animation:rainFall linear infinite}
@keyframes rainFall{0%{transform:translateY(-100%)}100%{transform:translateY(calc(52vh + 20px))}}
.atmo-dust{position:absolute;width:3px;height:3px;background:rgba(212,160,23,.25);border-radius:50%;animation:dustFloat linear infinite}
@keyframes dustFloat{0%{transform:translate(0,0) scale(1);opacity:.2}50%{opacity:.5}100%{transform:translate(30px,-60px) scale(.5);opacity:0}}
.atmo-fog{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 80%,rgba(100,120,140,.12),transparent 70%);animation:fogDrift 8s ease-in-out infinite alternate}
@keyframes fogDrift{0%{opacity:.3;transform:translateX(-5%)}100%{opacity:.6;transform:translateX(5%)}}
.atmo-spark{position:absolute;width:4px;height:4px;background:radial-gradient(circle,rgba(255,180,50,.7),transparent);border-radius:50%;animation:sparkRise 3s ease-out infinite}
@keyframes sparkRise{0%{transform:translateY(0) scale(1);opacity:.8}100%{transform:translateY(-80px) scale(0);opacity:0}}
/* === Scene Backgrounds === */
.scene-bg-study{background:linear-gradient(180deg,#1a1510,#161920)!important}
.scene-bg-hall{background:linear-gradient(180deg,#18141a,#1a1d24)!important}
.scene-bg-garden{background:linear-gradient(180deg,#0f1a14,#161920)!important}
.scene-bg-kitchen{background:linear-gradient(180deg,#1a1814,#1a1d24)!important}
.scene-bg-corridor{background:linear-gradient(180deg,#14161a,#1a1d24)!important}
.scene-bg-lab{background:linear-gradient(180deg,#101a1a,#161920)!important}
.scene-bg-office{background:linear-gradient(180deg,#161418,#1a1d24)!important}
.scene-bg-icu{background:linear-gradient(180deg,#101418,#161920)!important}
.scene-bg-suite{background:linear-gradient(180deg,#1a1418,#1a1d24)!important}
.scene-bg-stage{background:linear-gradient(180deg,#1a0f14,#161920)!important}
.scene-bg-gallery{background:linear-gradient(180deg,#14141a,#1a1d24)!important}
.scene-bg-cabin{background:linear-gradient(180deg,#101820,#161920)!important}
.scene-bg-deck{background:linear-gradient(180deg,#0f1520,#1a1d24)!important}
.scene-bg-living{background:linear-gradient(180deg,#1a1610,#161920)!important}
.scene-bg-cellar{background:linear-gradient(180deg,#0e1014,#1a1d24)!important}
.scene-bg-default{background:linear-gradient(180deg,#161920,#1a1d24)!important}
/* === Suspect Avatars === */
.suspect-av-male{border-color:#3498db!important;background:linear-gradient(135deg,#1a2530,#252a35)!important}
.suspect-av-female{border-color:#e74c8c!important;background:linear-gradient(135deg,#2a1a25,#252a35)!important}
.suspect-av-elder{border-color:#9aa0a6!important;background:linear-gradient(135deg,#222,#252a35)!important}
.suspect-av-suspect{border-color:#c0392b!important;box-shadow:0 0 8px rgba(192,57,43,.2)!important}
/* === Furniture Visuals === */
.sc-furn{overflow:hidden}
.sc-furn::after{content:attr(data-label);position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;color:rgba(154,160,166,.6);pointer-events:none}
/* === Notebook === */
.notebook-btn{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0px));right:calc(10px + (100% - 480px) / 2);width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#252a35,#1e222b);border:1px solid #2e3440;display:flex;align-items:center;justify-content:center;color:#d4a017;z-index:15;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer}
.notebook-btn:active{transform:scale(.92)}
.notebook-panel{position:fixed;bottom:calc(120px + env(safe-area-inset-bottom,0px));right:calc(10px + (100% - 480px) / 2);width:280px;max-height:320px;background:#1e222b;border:1px solid #2e3440;border-radius:14px;z-index:25;box-shadow:0 4px 20px rgba(0,0,0,.5);display:none;flex-direction:column;overflow:hidden}
.notebook-panel.show{display:flex;animation:fadeIn .25s ease}
.notebook-header{padding:12px 14px;border-bottom:1px solid #2e3440;font-size:14px;font-weight:600;color:#d4a017;display:flex;align-items:center;gap:6px}
.notebook-body{flex:1;overflow-y:auto;padding:10px 14px}
.notebook-entry{padding:8px 10px;background:#252a35;border-radius:8px;margin-bottom:6px;font-size:12px;line-height:1.6;color:#9aa0a6;border-left:2px solid #d4a017}
.notebook-input{width:100%;padding:8px 10px;background:#252a35;border:1px solid #2e3440;border-radius:8px;color:#e8e6e3;font-size:12px;resize:none;min-height:50px;font-family:inherit;outline:none}
.notebook-input:focus{border-color:#d4a017}
/* === Clue Association Hints === */
.clue-hint-glow{animation:clueHintPulse 1.5s ease-in-out infinite}
@keyframes clueHintPulse{0%,100%{box-shadow:0 0 0 0 rgba(212,160,23,0)}50%{box-shadow:0 0 0 4px rgba(212,160,23,.2)}}
.clue-synth-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:6px;font-size:10px;background:rgba(212,160,23,.12);color:#d4a017;margin-top:4px}
/* === Pressure System === */
.pressure-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#252a35;border-radius:8px;margin-bottom:8px}
.pressure-track{flex:1;height:6px;background:#2e3440;border-radius:3px;overflow:hidden}
.pressure-fill{height:100%;border-radius:3px;transition:width .3s,background .3s}
.pressure-low{background:#27ae60}.pressure-mid{background:#d4a017}.pressure-high{background:#c0392b}
.pressure-label{font-size:11px;color:#9aa0a6;min-width:36px}
/* === Case Progress on Menu === */
.case-card-progress{display:flex;align-items:center;gap:6px;margin-top:6px}
.case-card-progress-bar{flex:1;height:3px;background:#2e3440;border-radius:2px;overflow:hidden}
.case-card-progress-fill{height:100%;border-radius:2px;transition:width .3s}
.case-card-progress-text{font-size:10px;color:#9aa0a6;min-width:28px;text-align:right}
/* === Ending Animation === */
@keyframes starReveal{0%{transform:scale(0) rotate(-180deg);opacity:0}60%{transform:scale(1.3) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes titleSlide{0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:1}}
.end-star-anim{animation:starReveal .6s ease forwards;opacity:0}
.end-star-anim:nth-child(2){animation-delay:.2s}
.end-star-anim:nth-child(3){animation-delay:.4s}
.end-title-anim{animation:titleSlide .5s ease .5s forwards;opacity:0}
.end-desc-anim{animation:titleSlide .5s ease .7s forwards;opacity:0}
/* === Theme Support === */
body.theme-sepia{color:#d4c5a9}
body.theme-sepia #app{background:linear-gradient(180deg,#1a1610,#201c14)}
body.theme-sepia .screen{background:#1a1610}
body.theme-sepia .card,body.theme-sepia .modal{background:#201c14;border-color:#3a3428}
body.theme-sepia .top-bar,body.theme-sepia .bottom-nav{background:rgba(26,22,16,.95);border-color:#3a3428}
body.theme-sepia .sc-furn{background:#252018;border-color:#3a3428}
body.theme-sepia .scene-wrap{background:linear-gradient(180deg,#1a1610,#201c14);border-color:#3a3428}
body.theme-sepia .dlg-text,body.theme-sepia .q-btn,body.theme-sepia .pool-item{background:#252018}
body.theme-ocean{color:#c8dce8}
body.theme-ocean #app{background:linear-gradient(180deg,#0a1520,#0f1a28)}
body.theme-ocean .screen{background:#0a1520}
body.theme-ocean .card,body.theme-ocean .modal{background:#0f1a28;border-color:#1a3040}
body.theme-ocean .top-bar,body.theme-ocean .bottom-nav{background:rgba(10,21,32,.95);border-color:#1a3040}
body.theme-ocean .sc-furn{background:#0f1a28;border-color:#1a3040}
body.theme-ocean .scene-wrap{background:linear-gradient(180deg,#0a1520,#0f1a28);border-color:#1a3040}
body.theme-ocean .hotspot>svg{color:#4fc3f7}
body.theme-ocean .hotspot::before{border-color:rgba(79,195,247,.7);box-shadow:0 0 12px rgba(79,195,247,.35)}
body.theme-ocean .hp-label{color:#4fc3f7}
body.theme-ocean .text-accent{color:#4fc3f7}
/* === Gesture Support === */
.scene-wrap{touch-action:manipulation}
.longpress-hint{position:absolute;bottom:8px;right:8px;font-size:10px;color:rgba(154,160,166,.5);z-index:4;pointer-events:none}
</style>

perfect:{title:'侦探的觉醒',desc:'钱志明不仅要骗保——要让前妻背杀人嫌疑。委托信是陷阱，你的推理会成为定罪刘雅的证据。但你看穿了这一切。钱志明计划败露，刘雅得以清白。你——不再是谁的棋子。',stars:3}}},
{id:'c4',num:'004',name:'校园谜案',diff:3,brief:'晚自习后化学实验室爆炸，学生林小雨重伤昏迷。门从内反锁，监控无人进出，现场却出现陌生指纹。',briefing:'晚自习结束后，教学楼化学实验室突然发生剧烈爆炸。学生林小雨被发现倒在血泊中，昏迷不醒。实验室门从内侧反锁，走廊监控显示爆炸前30分钟无人进出。然而，门把手上却有一枚不属于在校师生的陌生指纹，通风管道也有被拆卸的痕迹。林小雨的手机最后一条消息发给了"那个人"……',scenes:[{id:'corridor',name:'教学楼走廊',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:5,y:10,w:20,h:12,l:'公告栏'},{x:70,y:8,w:22,h:14,l:'监控室'},{x:35,y:75,w:30,h:15,l:'休息长椅'}]},hotspots:[{id:'h1',x:50,y:20,ic:'door',name:'实验室门',desc:'门从内侧反锁，门把手上有一枚陌生指纹，不属于任何在校师生。门框有轻微变形。',clues:['c4_01']},{id:'h2',x:80,y:14,ic:'camera',name:'监控摄像头',desc:'监控录像显示爆炸前30分钟内无人通过走廊。但画面有短暂闪烁，似乎被干扰过。',clues:['c4_02']},{id:'h3',x:50,y:82,ic:'search',name:'走廊碎片',desc:'地上散落着玻璃碎片和一块被撕碎的纸片，上面隐约可见"危险"二字。',clues:['c4_03']}]},{id:'lab',name:'化学实验室',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:30,y:8,w:40,h:14,l:'实验台'},{x:5,y:40,w:18,h:30,l:'试剂柜'},{x:75,y:40,w:18,h:25,l:'通风管道'},{x:35,y:70,w:30,h:18,l:'储物架'}]},hotspots:[{id:'h4',x:50,y:15,ic:'blood',name:'爆炸中心',desc:'实验台被炸毁，残留物中检出高浓度硝酸铵成分。爆炸物并非实验室原有试剂。',clues:['c4_04']},{id:'h5',x:14,y:55,ic:'poison',name:'试剂柜',desc:'试剂柜中缺少两瓶浓硝酸。柜门上有林小雨的指纹，她似乎在查找什么。',clues:['c4_05']},{id:'h6',x:84,y:52,ic:'vent',name:'通风管道',desc:'通风管道螺丝被拧开，管道内壁有攀爬痕迹和新鲜指纹。管道通向楼外。',clues:['c4_06','c4_07'],requires:'c4_03'},{id:'h7',x:50,y:78,ic:'phone',name:'林小雨的书包',desc:'书包里有一本笔记本，记录着"学校地下仓库异常化学品清单"。手机最后消息发给"那个人"。',clues:['c4_08']}]},{id:'office',name:'教师办公室',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:10,y:10,w:35,h:16,l:'王老师办公桌'},{x:55,y:10,w:35,h:16,l:'其他办公桌'},{x:70,y:60,w:22,h:25,l:'文件柜'}]},hotspots:[{id:'h8',x:28,y:18,ic:'desk',name:'王老师的桌子',desc:'桌上有化学实验室钥匙和一份"化学品入库申请"被退回的文件。',clues:['c4_09']},{id:'h9',x:80,y:72,ic:'folder',name:'文件柜',desc:'文件柜中有一份匿名举报信，举报学校违规存放危化品，但被压了下来。',clues:['c4_10']}]},{id:'storage',name:'学校仓库',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:8,y:8,w:84,h:14,l:'货架'},{x:40,y:50,w:20,h:30,l:'工作台'},{x:75,y:65,w:18,h:20,l:'工具箱'}]},hotspots:[{id:'h10',x:50,y:15,ic:'clipboard',name:'入库记录',desc:'仓库入库记录显示大量硝酸铵等危化品，审批人一栏空白。最近一次入库是上周。',clues:['c4_11']},{id:'h11',x:82,y:72,ic:'key',name:'工具箱',desc:'工具箱中有通风管道专用螺丝刀和一双沾有化学药品的手套。',clues:['c4_12'],requires:'c4_06'}]}],suspects:[{id:'wang',name:'王老师',role:'化学老师·从教15年',dlgs:[{t:'爆炸发生时我在办公室批改作业，大概九点半听到爆炸声就跑过来了。实验室的钥匙只有我和教务处有。',r:[]},{q:'化学品入库申请为什么被退回？',req:null,a:'学校资金紧张，但有些实验必须做。后来……上面默许了，就没再走流程。',r:['c4_13']},{q:'仓库里的危化品你清楚吗？',req:'c4_11',a:'那些是学校统一采购的……至少我是这么认为的。具体谁批的我不知道。',r:[]},{q:'匿名举报信是你写的吗？',req:'c4_10',a:'不是我！但我确实向校长反映过安全隐患。他说会处理……',r:['c4_14'],c:true}]},{id:'zhang',name:'张同学',role:'林小雨同桌',dlgs:[{t:'晚自习结束后我就回宿舍了，没去过实验室。林小雨最近总神神秘秘的，好像在调查什么。',r:[]},{q:'有人看到你晚自习后接近实验室方向。',req:null,a:'我……我去拿过忘在那的课本，但没进实验室。我看到走廊有个黑影在通风口附近。',r:['c4_15']},{q:'林小雨在调查什么？',req:'c4_08',a:'她说学校仓库里有不该有的东西，要查清楚。她还说"那个人"会帮她。',r:['c4_16']},{q:'你认识"那个人"吗？',req:'c4_16',ev:'c4_16',a:'"那个人"……是李校工的儿子李强。他之前在化工厂工作，给小雨提供了一些化学品的信息。',r:['c4_17']}]},{id:'li',name:'李校工',role:'学校后勤·工作8年',dlgs:[{t:'我每晚巡查教学楼。今晚确实发现通风管道好像被打开过，但没在意……',r:[]},{q:'通风管道的螺丝需要什么工具才能拧开？',req:'c4_06',a:'需要专用螺丝刀。我……我的工具箱里确实有一把。但很久没用了。',r:[],c:true},{q:'你儿子李强在化工厂工作？',req:'c4_17',a:'是……他在化工厂。但他跟这事没关系！',r:[],c:true},{q:'仓库里的危化品是你帮忙搬运的？',req:'c4_12',ev:'c4_12',a:'……是校长让我搬的。我儿子说那些东西存放不当很危险。我不知道他们会用来……',r:['c4_18']}]}],clues:[{id:'c4_01',n:'陌生指纹',d:'实验室门把手上的指纹，经比对不属于任何在校师生员工。',cat:'物证'},{id:'c4_02',n:'监控闪烁',d:'走廊监控在爆炸前25分钟有3秒闪烁中断，疑似被短暂干扰。',cat:'物证'},{id:'c4_03',n:'撕碎纸片',d:'走廊碎片上的纸片印有"危险——请勿靠近通风口"字样。',cat:'物证'},{id:'c4_04',n:'硝酸铵残留',d:'爆炸残留物检出高浓度硝酸铵，该物质不在实验室日常使用清单中。',cat:'物证'},{id:'c4_05',n:'缺失试剂',d:'试剂柜缺少两瓶浓硝酸，柜门上有林小雨的指纹。',cat:'物证'},{id:'c4_06',n:'通风管拆卸',d:'通风管道螺丝被拧开，内壁有攀爬痕迹和新鲜指纹。',cat:'物证'},{id:'c4_07',n:'管道指纹',d:'通风管道内的指纹与门把手上的陌生指纹一致。',cat:'物证'},{id:'c4_08',n:'小雨的笔记',d:'笔记本记录"学校地下仓库异常化学品清单"，手机消息发给"那个人"。',cat:'文件'},{id:'c4_09',n:'退回申请',d:'王老师提交的化学品入库申请被校方退回，理由是"已有渠道"。',cat:'文件'},{id:'c4_10',n:'匿名举报',d:'有人匿名举报学校违规存放危化品，举报信被校长压下未处理。',cat:'文件'},{id:'c4_11',n:'入库记录',d:'仓库入库记录显示大量硝酸铵，审批人栏空白，最近入库是上周。',cat:'文件'},{id:'c4_12',n:'专用工具',d:'李校工工具箱中有通风管专用螺丝刀和沾有化学药品的手套。',cat:'物证'},{id:'c4_13',n:'默许采购',d:'王老师证实校方默许通过非正规渠道采购危化品。',cat:'口供'},{id:'c4_14',n:'校长知情',d:'王老师曾向校长反映安全隐患，校长承诺处理但实际未作为。',cat:'口供'},{id:'c4_15',n:'走廊黑影',d:'张同学看到爆炸前有人在通风口附近活动的黑影。',cat:'口供'},{id:'c4_16',n:'小雨的调查',d:'林小雨发现学校违规存放危化品，正在深入调查。',cat:'推理'},{id:'c4_17',n:'那个人',d:'"那个人"是李校工的儿子李强，在化工厂工作，为小雨提供信息。',cat:'推理'},{id:'c4_18',n:'校长指使',d:'李校工承认是校长让他搬运危化品，李强提供了专业建议。',cat:'口供'}],timeline:{events:[{id:'t1',text:'晚自习结束，学生陆续返回宿舍',time:'20:30',order:0},{id:'t2',text:'林小雨独自前往教学楼方向',time:'20:40',order:1},{id:'t3',text:'最后一名学生离开教学楼',time:'20:45',order:2},{id:'t4',text:'监控画面短暂闪烁中断',time:'20:55',order:3},{id:'t5',text:'张同学看到走廊黑影',time:'21:00',order:4},{id:'t6',text:'林小雨发送最后一条消息',time:'21:05',order:5},{id:'t7',text:'化学实验室发生剧烈爆炸',time:'21:10',order:6},{id:'t8',text:'王老师等人赶到现场',time:'21:15',order:7}]},synthesis:[{input:['c4_01','c4_07'],output:'c4_15',text:'指纹一致——有人从通风管道进入实验室，绕过门锁。'},{input:['c4_04','c4_17'],output:'c4_16',text:'硝酸铵来自化工厂——李强提供了化学品并指导了操作。'},{input:['c4_08','c4_11'],output:'c4_18',text:'林小雨发现了违规存放的证据——这是爆炸的真正原因。'}],accusation:{suspect:'li',evidence:['c4_06','c4_12','c4_18'],summary:'李校工在儿子李强的指使下，利用专用工具从通风管道进入实验室制造爆炸，目的是销毁学校违规存放危化品的证据。林小雨因发现真相而遭到灭口。'},twist:{text:'你以为这只是校工父子的罪行？李校工只是执行者。真正的幕后黑手是校长——他违规采购危化品牟利，得知林小雨调查后指使李校工制造爆炸。而李强之所以配合，是因为校长欠他巨额工资。每个人都有不得已的苦衷，但代价是一个学生的生命。',contras:[{text:'李校工的工具箱里有专用螺丝刀——但他说"很久没用了"，螺丝上却有新鲜油渍。',ev:'c4_12'},{text:'监控闪烁3秒——只有内部人员才知道摄像头的位置和盲区。',ev:'c4_02'},{text:'退回申请上写着"已有渠道"——说明校长一直在绕过正规采购。',ev:'c4_09'}]},endings:{surface:{title:'校工的罪责',desc:'李校工被认定为凶手，承认从通风管道进入实验室制造爆炸。案件告破，但真相似乎不止于此……',stars:1},true_end:{title:'校园的秘密',desc:'李校工父子被捕。调查揭露学校长期违规存放危化品，校长被免职。林小雨苏醒后指认了真相。但那些被压下的举报信，又该由谁来追究？',stars:2},perfect:{title:'链条的每一环',desc:'你揭开了完整的真相链：校长违规采购牟利→李强提供技术→李校工执行爆炸→林小雨因调查遭灭口。校长被逮捕，学校被整顿。林小雨的勇敢调查没有白费——但她的代价太过沉重。每一个沉默的人，都是这条罪链的一环。',stars:3}}},
{id:'c5',num:'005',name:'医院疑云',diff:3,brief:'ICU患者赵明远凌晨突然死亡。值班护士称全程未离开，体内却检出致命剂量氯化钾。',briefing:'凌晨3点，市医院ICU患者赵明远突然死亡。值班护士刘芳声称全程在护士站值守，但尸检在其体内检出致命剂量氯化钾。监控显示2:30至3:00有三人进出ICU病区。输液袋残液中氯化钾浓度异常偏高，而赵明远的处方中根本不需要这种药物。三年前，刘芳的父亲曾因赵明远的一次疏忽去世……',scenes:[{id:'icu',name:'ICU病房',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:30,y:25,w:40,h:30,l:'病床'},{x:8,y:10,w:18,h:20,l:'输液架'},{x:75,y:15,w:18,h:18,l:'监护仪'},{x:70,y:70,w:22,h:18,l:'药品推车'}]},hotspots:[{id:'h1',x:50,y:40,ic:'bed',name:'病床',desc:'赵明远安详地躺在床上，看似自然死亡。但嘴唇微紫，指甲发绀——典型的氯化钾中毒症状。',clues:['c5_01']},{id:'h2',x:17,y:20,ic:'poison',name:'输液架',desc:'输液袋残液中检出高浓度氯化钾。正常输液不含此成分。输液管连接处有被拔插过的痕迹。',clues:['c5_02']},{id:'h3',x:84,y:24,ic:'display',name:'监护仪',desc:'监护仪记录显示心率从2:35开始异常，3:00完全停止。数据被部分清除。',clues:['c5_03']},{id:'h4',x:80,y:78,ic:'clipboard',name:'药品推车',desc:'推车上有常规药品，但氯化钾库存少了2支。推车曾离开过病房。',clues:['c5_04']}]},{id:'nurse_station',name:'护士站',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:25,y:10,w:50,h:16,l:'值班台'},{x:5,y:55,w:20,h:30,l:'药品柜'},{x:70,y:55,w:22,h:25,l:'储物柜'}]},hotspots:[{id:'h5',x:50,y:18,ic:'clipboard',name:'值班记录',desc:'刘芳记录2:45巡查病房"患者安稳"。但监护仪显示2:35心率已异常——记录与数据矛盾。',clues:['c5_05']},{id:'h6',x:15,y:68,ic:'key',name:'药品柜',desc:'药品柜中氯化钾少了2支。取用登记本上无人签字。柜门指纹只有刘芳的。',clues:['c5_06']},{id:'h7',x:80,y:65,ic:'search',name:'垃圾桶',desc:'垃圾桶底部发现一双带微量血迹的乳胶手套。血迹经检验属于赵明远。',clues:['c5_07']}]},{id:'pharmacy',name:'药房',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:8,y:8,w:84,h:14,l:'药品货架'},{x:30,y:45,w:40,h:20,l:'配药台'},{x:75,y:70,w:18,h:20,l:'冷藏柜'}]},hotspots:[{id:'h8',x:50,y:15,ic:'folder',name:'药品出入库',desc:'氯化钾出入库记录完整，但有一笔"报废"记录——报废人签名模糊不清。',clues:['c5_08']},{id:'h9',x:50,y:55,ic:'desk',name:'配药台',desc:'配药台上残留微量氯化钾粉末。台面被擦拭过，但紫外灯下仍可见痕迹。',clues:['c5_09']}]},{id:'corridor_h',name:'ICU走廊',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:5,y:10,w:25,h:14,l:'监控屏'},{x:60,y:8,w:30,h:12,l:'访客登记台'}]},hotspots:[{id:'h10',x:20,y:16,ic:'camera',name:'走廊监控',desc:'监控显示：2:30刘芳进入病区，2:40陈医生查房，2:50赵太太到达。但2:35-2:42画面有雪花干扰。',clues:['c5_10']},{id:'h11',x:72,y:14,ic:'person',name:'访客登记',desc:'登记簿显示赵太太2:50到达，停留10分钟。但保安回忆她似乎来过两次。',clues:['c5_11']}]}],suspects:[{id:'liu',name:'刘芳',role:'ICU值班护士·从业5年',dlgs:[{t:'我2:30到护士站值班，期间多次查看病人。赵明远病情稳定，预计下周转ICU。3点发现他心跳停止。',r:[]},{q:'你和赵明远以前认识吗？',req:null,a:'……三年前他住过我们科。当时我父亲也在住院。',r:['c5_12']},{q:'值班记录写2:45患者安稳，但监护仪2:35心率已异常。',req:'c5_05',a:'可能是……我记错了巡查时间。记录有时不太准确。',r:[],c:true},{q:'药品柜上只有你的指纹。',req:'c5_06',ev:'c5_06',a:'……是我拿的。三年前我父亲因为他的疏忽死的。他害死了我爸，却活得好好的。这不公平。',r:['c5_13']}]},{id:'chen',name:'陈医生',role:'ICU主治医生·从医12年',dlgs:[{t:'我2:40去ICU查房，赵明远情况正常。他的治疗方案不需要氯化钾。',r:[]},{q:'赵明远的医疗事故记录？',req:'c5_12',a:'三年前……确实有一次。一位患者在赵明远负责的区域因用药延误去世。赵明远被内部警告。',r:['c5_14']},{q:'监控2:35到2:42有干扰，你在做什么？',req:'c5_10',a:'我在医生办公室写病历。那段时间的监控干扰是设备老化，经常发生。',r:['c5_15']}]},{id:'zhao_w',name:'赵太太',role:'死者妻子',dlgs:[{t:'我2:50到医院看了一眼丈夫，待了十分钟就回家了。他看起来精神还不错。',r:[]},{q:'保安说你似乎来过两次？',req:'c5_11',a:'我……我2:35也来过一次，但那时候他已经睡了，我没进去。',r:['c5_16']},{q:'你丈夫有巨额意外险？',req:null,a:'是的，一份高额意外险。但这是他自己买的，跟我没关系。',r:['c5_17']},{q:'垃圾桶里的手套上有你丈夫的血迹。',req:'c5_07',ev:'c5_07',a:'我……我碰到他伤口了？不可能，我只是看了看……',r:[],c:true}]}],clues:[{id:'c5_01',n:'中毒症状',d:'赵明远嘴唇微紫、指甲发绀，符合氯化钾注射致死的典型症状。',cat:'物证'},{id:'c5_02',n:'输液异常',d:'输液袋残液含高浓度氯化钾，输液管连接处有被拔插痕迹。',cat:'物证'},{id:'c5_03',n:'监护数据',d:'监护仪显示心率2:35开始异常，3:00停止。部分数据被清除。',cat:'物证'},{id:'c5_04',n:'药品短缺',d:'ICU药品推车上的氯化钾少了2支，推车曾离开病房。',cat:'物证'},{id:'c5_05',n:'记录矛盾',d:'刘芳记录2:45患者安稳，但监护仪2:35心率已异常——时间矛盾。',cat:'文件'},{id:'c5_06',n:'柜门指纹',d:'药品柜门只有刘芳的指纹，氯化钾取用无人登记。',cat:'物证'},{id:'c5_07',n:'血迹手套',d:'垃圾桶发现带赵明远血迹的乳胶手套，手套内有刘芳的皮屑。',cat:'物证'},{id:'c5_08',n:'报废记录',d:'氯化钾有一笔"报废"记录，签名模糊，日期是三天前。',cat:'文件'},{id:'c5_09',n:'配药台痕迹',d:'配药台被擦拭过，但紫外灯下检出氯化钾粉末残留。',cat:'物证'},{id:'c5_10',n:'监控干扰',d:'走廊监控2:35-2:42有雪花干扰，恰好覆盖投毒时间窗口。',cat:'物证'},{id:'c5_11',n:'两次到访',d:'赵太太承认2:35来过一次但未进病房，2:50再次到达。',cat:'口供'},{id:'c5_12',n:'旧日恩怨',d:'三年前赵明远的疏忽导致刘芳父亲用药延误去世。',cat:'推理'},{id:'c5_13',n:'复仇自白',d:'刘芳承认因父亲之死向赵明远输液袋注入氯化钾。',cat:'口供'},{id:'c5_14',n:'事故档案',d:'赵明远三年前因用药延误被内部警告，患者死亡。',cat:'文件'},{id:'c5_15',n:'监控老化',d:'陈医生称监控干扰是设备老化所致，维修记录证实这一点。',cat:'文件'},{id:'c5_16',n:'秘密到访',d:'赵太太2:35秘密到访，可能目睹了某些情况。',cat:'推理'},{id:'c5_17',n:'高额保险',d:'赵明远生前购买高额意外险，受益人为赵太太。',cat:'文件'},{id:'c5_18',n:'预谋投毒',d:'三天前的报废记录是刘芳为今天的投毒提前准备的氯化钾。',cat:'推理'}],timeline:{events:[{id:'t1',text:'刘芳到达护士站开始值班',time:'2:30',order:0},{id:'t2',text:'赵太太第一次到达医院（未进病房）',time:'2:35',order:1},{id:'t3',text:'陈医生进入ICU查房',time:'2:40',order:2},{id:'t4',text:'监控出现雪花干扰',time:'2:40',order:3},{id:'t5',text:'刘芳伪造巡查记录',time:'2:45',order:4},{id:'t6',text:'赵太太第二次到达，进入病房探视',time:'2:50',order:5},{id:'t7',text:'监护仪显示赵明远心跳停止',time:'3:00',order:6},{id:'t8',text:'刘芳发现异常，呼叫抢救',time:'3:05',order:7}]},synthesis:[{input:['c5_02','c5_06'],output:'c5_13',text:'输液管被拔插加上柜门指纹——刘芳在值班时取出氯化钾注入输液袋。'},{input:['c5_05','c5_10'],output:'c5_18',text:'记录矛盾加监控干扰——投毒时间被精心选择在监控盲区。'},{input:['c5_08','c5_09'],output:'c5_12',text:'提前报废氯化钾加配药台痕迹——这是预谋复仇。'}],accusation:{suspect:'liu',evidence:['c5_02','c5_06','c5_13'],summary:'刘芳因三年前父亲因赵明远疏忽去世，利用值班机会从药品柜取出氯化钾注入输液袋，伪造巡查记录，在监控干扰时段完成投毒。这是一场精心策划的复仇。'},twist:{text:'你以为这只是护士的复仇？赵太太2:35的第一次到访并非偶然——她接到过匿名电话说"你丈夫今晚会有事"。打电话的人正是陈医生。他知道刘芳的计划，却不阻止，反而想借刀杀人——因为赵明远的事故也毁了他的职业生涯。三个人的命运，被三年前的那场医疗事故永远改变。',contras:[{text:'刘芳的值班记录与监护仪数据矛盾——2:45记录"安稳"时，患者心率已异常10分钟。',ev:'c5_05'},{text:'药品柜只有刘芳的指纹——但报废记录是三天前的，说明她提前准备了氯化钾。',ev:'c5_08'},{text:'赵太太2:35来过医院——她声称"看了一眼就走"，但走廊监控显示她停留了8分钟。',ev:'c5_11'}]},endings:{surface:{title:'白衣天使的堕落',desc:'刘芳被捕，承认在输液袋中注入氯化钾杀害赵明远。医院加强药品管理。但赵太太的秘密到访仍是未解之谜。',stars:1},true_end:{title:'三年前的亡灵',desc:'刘芳为父复仇，在ICU值班时向赵明远输液袋注入氯化钾。三年前的医疗事故夺走了她的父亲，如今她用同样的方式夺走了赵明远的生命。陈医生知情不报，赵太太接到匿名电话——每个人都在这场悲剧中扮演了角色。',stars:2},perfect:{title:'因果之链',desc:'你揭开了完整的因果链：赵明远疏忽致刘芳父亲去世→陈医生受牵连→刘芳预谋复仇→陈医生匿名通知赵太太却不阻止→三人各怀心思，一条人命成了清算的工具。刘芳被捕时平静地说："我只是让三年前的事重演了一次。"你沉默了——正义与复仇的边界，从来都不清晰。',stars:3}}},
{id:'c6',num:'006',name:'酒店密室',diff:4,brief:'五星酒店总统套房内，富商周德华死于反锁房中。门链内挂，窗户密封，空调出风口有微量血迹。千万珠宝失踪。',briefing:'五星酒店总统套房，富商周德华被发现在房内死亡。门链从内侧挂上，窗户密封完好，形成完美密室。空调出风口发现微量血迹和纤维，房内保险箱被打开，价值千万的珠宝不翼而飞。走廊监控在凌晨2点出现5分钟空白。谁能在密室中杀人盗宝？',scenes:[{id:'suite',name:'总统套房',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:30,y:30,w:40,h:25,l:'大床'},{x:5,y:10,w:22,h:16,l:'保险箱柜'},{x:70,y:8,w:22,h:14,l:'空调出风口'},{x:70,y:65,w:22,h:20,l:'阳台门'}]},hotspots:[{id:'h1',x:50,y:42,ic:'person',name:'尸体',desc:'周德华躺在床上，面部发绀。法医初步判断死因为麻醉气体过量导致呼吸衰竭。口鼻有轻微泡沫。',clues:['c6_01']},{id:'h2',x:16,y:18,ic:'lock',name:'保险箱',desc:'保险箱已被打开，内部珠宝失踪。箱面被仔细擦拭过，但角落残留半枚指纹。',clues:['c6_02']},{id:'h3',x:80,y:15,ic:'vent',name:'空调出风口',desc:'出风口栅格内侧发现微量血迹和深色纤维。出风口连接中央空调管道，口径仅容一人侧身通过。',clues:['c6_03']},{id:'h4',x:80,y:72,ic:'door',name:'门链',desc:'门链确实从内侧挂上，无破坏痕迹。但门链固定螺丝有被重新拧过的痕迹。',clues:['c6_04']}]},{id:'corridor_h',name:'酒店走廊',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:10,y:10,w:25,h:14,l:'监控摄像头'},{x:50,y:40,w:30,h:18,l:'服务推车'},{x:5,y:70,w:20,h:20,l:'消防通道'}]},hotspots:[{id:'h5',x:22,y:16,ic:'camera',name:'走廊监控',desc:'监控录像显示凌晨2:00-2:05有5分钟空白。空白前后画面正常衔接，像是被精确剪辑过。',clues:['c6_05']},{id:'h6',x:62,y:48,ic:'poison',name:'服务推车',desc:'推车上发现微量麻醉剂残留。推车今晚被多人使用过，但清洁记录显示只有李服务员签出。',clues:['c6_06']},{id:'h7',x:15,y:78,ic:'key',name:'消防通道',desc:'消防通道门正常关闭，门把手无异常指纹。通道内监控完好。',clues:['c6_07']}]},{id:'ac_room',name:'中央空调机房',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:10,y:10,w:35,h:25,l:'主机组'},{x:55,y:10,w:35,h:20,l:'管道分配区'},{x:30,y:60,w:40,h:25,l:'维修工具架'}]},hotspots:[{id:'h8',x:70,y:20,ic:'footprint',name:'管道痕迹',desc:'通往总统套房的管道内有新鲜刮痕和纤维残留。管道盖板上发现孙经理的工牌挂绳碎片。',clues:['c6_08']},{id:'h9',x:50,y:70,ic:'search',name:'工具架',desc:'工具架上有管道拆卸工具和一小瓶麻醉喷雾。工具近期使用过。',clues:['c6_09']}]},{id:'lobby',name:'酒店大堂',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y '部分自白',d:'孙经理承认通过管道进入房间偷珠宝，但否认杀人。',cat:'口供'},{id:'c6_13',n:'推车矛盾',d:'李服务员否认使用麻醉剂，但推车上确有残留。',cat:'口供'},{id:'c6_14',n:'钥匙归属',d:'服务推车清洁间只有经理有钥匙，排除外人使用的可能。',cat:'推理'},{id:'c6_15',n:'珠宝清单',d:'周太太有所有珠宝的购买凭证和照片，确认失窃物品。',cat:'文件'},{id:'c6_16',n:'被害预感',d:'周德华生前感觉被人跟踪，更换了门锁。',cat:'口供'},{id:'c6_17',n:'门链诡计',d:'门链螺丝被重新拧过——凶手离开后用工具从门外将门链挂上。',cat:'推理'},{id:'c6_18',n:'监控内鬼',d:'能精确剪辑5分钟监控的只有掌握系统权限的酒店经理。',cat:'推理'}],timeline:{events:[{id:'t1',text:'李服务员送红酒到总统套房',time:'21:00',order:0},{id:'t2',text:'周太太离开套房去餐厅',time:'21:30',order:1},{id:'t3',text:'孙经理离开前台"巡查楼层"',time:'1:50',order:2},{id:'t4',text:'走廊监控出现5分钟空白',time:'2:00',order:3},{id:'t5',text:'孙经理返回前台',time:'2:10',order:4},{id:'t6',text:'孙经理通过管道进入套房',time:'2:15',order:5},{id:'t7',text:'麻醉气体释放，周德华失去意识',time:'2:20',order:6},{id:'t8',text:'保险箱被打开，珠宝被取走，门链从外布置',time:'2:30',order:7}]},synthesis:[{input:['c6_03','c6_08'],output:'c6_17',text:'管道血迹和工牌碎片——孙经理通过中央空调管道进入套房。'},{input:['c6_05','c6_10'],output:'c6_18',text:'监控空白与经理行踪吻合——只有他能操控监控系统。'},{input:['c6_04','c6_06'],output:'c6_12',text:'门链被重新布置加推车麻醉剂——密室是伪造的，凶手从管道进出。'}],accusation:{suspect:'sun',evidence:['c6_08','c6_10','c6_18'],summary:'孙经理利用对酒店系统的了解，通过中央空调管道进入总统套房。他先剪辑监控，再用麻醉气体迷晕周德华，打开保险箱取走珠宝后将其杀害。离开时用特殊工具从门外挂上门链，制造密室假象。'},twist:{text:'你以为孙经理只是贪财？周德华换门锁是因为他知道有人要对他下手。周太太的指纹在保险箱上——她之前已经偷偷转移了一部分珠宝。孙经理偷的"千万珠宝"中，有一半是周太太事先藏匿的。三个人互相算计，最终只有一具尸体和一间密室。',contras:[{text:'监控空白精确5分钟——只有掌握系统权限的酒店经理才能做到。',ev:'c6_05'},{text:'管道内的工牌挂绳碎片直接指向孙经理。',ev:'c6_08'},{text:'门链螺丝被重新拧过——证明密室是从外部伪造的。',ev:'c6_04'}]},endings:{surface:{title:'密室的答案',desc:'孙经理承认通过管道进入房间盗取珠宝，但坚称周德华死于麻醉意外。珠宝被追回部分，案件仍有疑点。',stars:1},true_end:{title:'管道的秘密',desc:'孙经理利用中央空调管道进入密室，用麻醉气体杀害周德华盗取珠宝。他剪辑监控、伪造门链，精心设计了完美密室。但他低估了管道里留下的痕迹。天网恢恢。',stars:2},perfect:{title:'三个人的棋局',desc:'你揭开了三方角力的全貌：周太太事先转移部分珠宝→孙经理策划管道盗窃→周德华察觉危险换锁却为时已晚。孙经理的麻醉气体过量并非意外——他在慌乱中用了双倍剂量，因为周德华比他预想的更难对付。三个贪婪的人，一个死在密室里，两个在铁窗后。',stars:3}}},
{id:'c7',num:'007',name:'剧院魅影',diff:4,brief:'首演之夜，女主角苏曼在舞台上中毒倒下。氰化物藏在她的润喉糖中，但化妆间只有三人有钥匙。',briefing:'大剧院首演之夜，女主角苏曼在表演高潮时突然中毒倒地。毒物是氰化物，混在她随身携带的润喉糖中。化妆间门锁完好，只有苏曼、导演陈刚和化妆师林小美有钥匙。演出期间三人都有不在场证明。但润喉糖盒上除了苏曼的指纹，还有一双被擦拭过的手套痕迹……',scenes:[{id:'dressing_room',name:'化妆间',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:25,y:8,w:50,h:16,l:'化妆台'},{x:5,y:50,w:18,h:25,l:'衣柜'},{x:75,y:50,w:18,h:20,l:'垃圾桶'},{x:30,y:72,w:35,h:16,l:'沙发'}]},hotspots:[{id:'h1',x:50,y:16,ic:'desk',name:'化妆台',desc:'台面上有苏曼的化妆品和一瓶不属于她的香水残留气味。抽屉里有润喉糖的空盒。',clues:['c7_01']},{id:'h2',x:82,y:58,ic:'search',name:'垃圾桶',desc:'垃圾桶底部有一双被揉成团的乳胶手套，手套内侧检出手汗DNA。',clues:['c7_02']},{id:'h3',x:48,y:80,ic:'poison',name:'润喉糖',desc:'苏曼随身携带的润喉糖盒中检出氰化物残留。糖盒表面有被擦拭的痕迹。',clues:['c7_03']},{id:'h4',x:14,y:60,ic:'key',name:'衣柜',desc:'衣柜里挂着苏曼的演出服。口袋中有一张纸条："你会为你的傲慢付出代价。"',clues:['c7_04']}]},{id:'backstage',name:'后台走廊',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:8,y:8,w:25,h:18,l:'道具箱'},{x:60,y:8,w:30,h:16,l:'服装架'},{x:70,y:60,w:22,h:22,l:'紧急出口'}]},hotspots:[{id:'h5',x:20,y:16,ic:'suitcase',name:'道具箱',desc:'道具箱底层发现一个空的棕色小瓶，标签被撕掉。残留物检出氰化物溶液。',clues:['c7_05']},{id:'h6',x:72,y:16,ic:'frame',name:'服装架',desc:'服装架上苏曼的备用演出服被人动过，衣领处有微量白色粉末。',clues:['c7_06']},{id:'h7',x:80,y:68,ic:'door',name:'紧急出口',desc:'紧急出口门锁有被撬动痕迹。门外通向停车场。监控未覆盖此区域。',clues:['c7_07']}]},{id:'stage',name:'舞台',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:25,y:20,w:50,h:30,l:'主表演区'},{x:5,y:65,w:20,h:20,l:'侧幕'},{x:75,y:65,w:20,h:20,l:'提词区'}]},hotspots:[{id:'h8',x:50,y:35,ic:'blood',name:'苏曼倒下位置',desc:'舞台标记显示苏曼在第三幕第二场倒下。杯中残余液体检出微量氰化物。',clues:['c7_08']},{id:'h9',x:15,y:72,ic:'person',name:'侧幕区域',desc:'侧幕发现一个被丢弃的化妆棉，上面有不属于自己的香水味。',clues:['c7_09']}]},{id:'control_room',name:'控制室',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:10,y:10,w:80,h:14,l:'控制台'},{x:10,y:40,w:30,h:20,l:'监控屏'},{x:60,y:45,w:30,h:25,l:'储物柜'}]},hotspots:[{id:'h10',x:50,y:16,ic:'display',name:'控制台',desc:'控制台记录显示灯光切换正常。陈导演全程在此监控舞台效果。',clues:['c7_10']},{id:'h11',x:72,y:55,ic:'folder',name:'储物柜',desc:'柜中有一本陈导演的日记，最后一页写着："必须换掉苏曼，否则整个剧就毁了。"',clues:['c7_11']}]}],suspects:[{id:'chen',name:'陈刚',role:'导演·从业20年',dlgs:[{t:'演出时我一直在控制室盯舞台效果。苏曼是最好的女主角，我们合作多年。化妆间钥匙我一直带着。',r:[]},{q:'日记里写"必须换掉苏曼"？',req:'c7_11',a:'那是艺术上的分歧。她太自我了，影响了整体效果。但我不会伤害她。',r:['c7_12']},{q:'彩排时谁用过化妆间钥匙？',req:null,a:'彩排时……我把钥匙给过小林，让她帮忙布置化妆台。',r:['c7_13']},{q:'道具箱里的氰化物小瓶是你的？',req:'c7_05',ev:'c7_05',a:'我……那是用来处理道具的化学品。我放在那里的，但没想过有人会用来……',r:['c7_14'],c:true}]},{id:'lin',name:'林小美',role:'化妆师·入职1年',dlgs:[{t:'上台前10分钟我给苏曼补了妆。她的润喉糖我不碰，那是她的私人物品。',r:[]},{q:'化妆台上有不属于苏曼的香水味。',req:'c7_01',a:'那是……我的香水。补妆时可能沾到台面上了。',r:[]},{q:'垃圾桶的手套内侧检出了你的DNA。',req:'c7_02',a:'……',r:[]},{q:'你长期被苏曼打压？',req:'c7_04',ev:'c7_04',a:'她把我的设计说成一文不值，在导演面前贬低我。那天她又在衣柜里留了那张纸条羞辱我……我受够了。补妆时我调换了她的润喉糖。',r:['c7_15']}]},{id:'zhao',name:'赵副导',role:'副导演·任职5年',dlgs:[{t:'苏曼演技很好但太强势。彩排时钥匙的事……我不太记得了。',r:[]},{q:'紧急出口有被撬动痕迹。',req:'c7_07',a:'那个门经常有人忘记关。我不清楚具体情况。',r:[]},{q:'赵副导，你有化妆间的备用钥匙？',req:'c7_13',a:'……是有一把备用的。但我没用过。陈导演不知道这件事。',r:['c7_16'],c:true}]}],clues:[{id:'c7_01',n:'陌生香水',d:'化妆台上有不属于苏曼的香水残留，气味与林小美常用品牌一致。',cat:'物证'},{id:'c7_02',n:'乳胶手套',d:'垃圾桶发现乳胶手套，内侧检出手汗DNA与林小美匹配。',cat:'物证'},{id:'c7_03',n:'有毒润喉糖',d:'苏曼的润喉糖盒中检出氰化物，糖盒表面有被擦拭痕迹。',cat:'物证'},{id:'c7_04',n:'威胁纸条',d:'衣柜中发现纸条"你会为你的傲慢付出代价"，笔迹待鉴定。',cat:'物证'},{id:'c7_05',n:'氰化物小瓶',d:'道具箱发现空棕色小瓶，残留氰化物溶液。标签被撕掉。',cat:'物证'},{id:'c7_06',n:'演出服粉末',d:'苏曼备用演出服衣领处有微量白色粉末，初检为氰化物。',cat:'物证'},{id:'c7_07',n:'出口痕迹',d:'紧急出口门锁有撬动痕迹，通向无监控的停车场。',cat:'物证'},{id:'c7_08',n:'舞台残液',d:'苏曼演出杯中残液检出微量氰化物，她在台上服用了润喉糖后倒下。',cat:'物证'},{id:'c7_09',n:'化妆棉',d:'侧幕丢弃的化妆棉上有林小美使用的香水味。',cat:'物证'},{id:'c7_10',n:'导演不在场',d:'控制台记录证实陈导演演出期间全程在控制室。',cat:'文件'},{id:'c7_11',n:'导演日记',d:'陈导演日记写"必须换掉苏曼"，但内容为艺术分歧而非人身威胁。',cat:'文件'},{id:'c7_12',n:'艺术分歧',d:'陈导演与苏曼存在艺术理念冲突，但无个人仇恨。',cat:'推理'},{id:'c7_13',n:'钥匙流转',d:'彩排时陈导演将化妆间钥匙交给林小美布置化妆台。',cat:'口供'},{id:'c7_14',n:'导演藏毒',d:'陈导演承认道具箱的氰化物是他存放的，用于道具制作。',cat:'口供'},{id:'c7_15',n:'调换自白',d:'林小美承认因长期被霸凌，趁补妆时调换了苏曼的润喉糖。',cat:'口供'},{id:'c7_16',n:'备用钥匙',d:'赵副导有化妆间备用钥匙且未告知导演，但他不是凶手。',cat:'口供'},{id:'c7_17',n:'霸凌证据',d:'多名工作人员证实苏曼长期贬低林小美的工作。',cat:'推理'},{id:'c7_18',n:'补妆时间线',d:'林小美是最后一个接触苏曼的人，补妆时完成了调换。',cat:'推理'}],timeline:{events:[{id:'t1',text:'苏曼到达化妆间准备',time:'18:00',order:0},{id:'t2',text:'彩排结束，化妆间钥匙交给林小美',time:'19:00',order:1},{id:'t3',text:'林小美用钥匙进入化妆间布置',time:'19:15',order:2},{id:'t4',text:'林小美为苏曼最后补妆并调换润喉糖',time:'19:30',order:3},{id:'t5',text:'演出正式开始',time:'19:50',order:4},{id:'t6',text:'苏曼在第三幕服用润喉糖',time:'20:10',order:5},{id:'t7',text:'苏曼在舞台上中毒倒下',time:'20:15',order:6}]},synthesis:[{input:['c7_02','c7_01'],output:'c7_18',text:'手套DNA和香水痕迹——林小美在化妆间作案后丢弃手套。'},{input:['c7_05','c7_14'],output:'c7_17',text:'氰化物来自道具箱——陈导演存放的化学品被林小美取用。'},{input:['c7_04','c7_13'],output:'c7_15',text:'威胁纸条和钥匙流转——苏曼的霸凌是林小美作案的动机和条件。'}],accusation:{suspect:'lin',evidence:['c7_02','c7_01','c7_15'],summary:'林小美因长期被苏曼霸凌心生怨恨。她利用补妆机会调换润喉糖，将含有氰化物的糖盒放回。氰化物取自陈导演存放在道具箱的化学品。乳胶手套和香水是她的疏忽。'},twist:{text:'你以为这只是霸凌导致的冲动杀人？林小美的计划远比想象中精密。她提前一周复制了化妆间钥匙，在道具箱的氰化物中浸泡了润喉糖。那张威胁纸条是她故意留给苏曼的——目的是让苏曼在演出前情绪激动，更容易在台上服用润喉糖润喉。这不是冲动，是精心设计的谋杀。',contras:[{text:'林小美声称没碰过苏曼的东西，但手套DNA和香水痕迹证明她在化妆间进行了操作。',ev:'c7_02'},{text:'润喉糖盒被擦拭过——只有戴手套的人才会这样做，而手套在垃圾桶里。',ev:'c7_03'},{text:'林小美是最后一个接触苏曼的人——补妆的10分钟足以完成调换。',ev:'c7_09'}]},endings:{surface:{title:'谢幕的悲剧',desc:'林小美被捕，承认在补妆时调换了润喉糖。案件以故意伤害致死结案。但润喉糖上的擦拭痕迹暗示更多预谋。',stars:1},true_end:{title:'化妆间的双面',desc:'林小美长期被苏曼霸凌，最终在补妆时调换了有毒的润喉糖。她提前复制钥匙、从道具箱取得氰化物，计划了这场"完美"的谋杀。乳胶手套和香水暴露了她。一个才华横溢的年轻化妆师，被霸凌逼成了杀人犯。',stars:2},perfect:{title:'面具之下',desc:'你揭开了全部真相：林小美的"冲动"实为精心策划。威胁纸条是她故意放置，用来激怒苏曼确保她在台上用润喉糖。润喉糖提前一周用氰化物浸泡。复制钥匙、取用道具箱化学品、选择补妆时机——每一步都经过计算。霸凌是起因，但不是借口。当你在审讯室指出这一切时，林小美终于摘下了面具："她毁了我的一切。我只是让她提前谢幕。"',stars:3}}},
{id:'c8',num:'008',name:'博物馆盗窃',diff:4,brief:'闭馆后博物馆镇馆之宝"翡翠凤凰"不翼而飞。展柜完好，警报未触发，监控无异常。三名夜班员工都有嫌疑。',briefing:'市博物馆闭馆后，价值连城的国家一级文物"翡翠凤凰"不翼而飞。展柜玻璃完好无损，警报系统未触发，监控显示闭馆后无人进出展区。然而文物就这样凭空消失了。当晚值班的只有三人：夜班保安老周、清洁工小张、文物管理员刘建国。谁能在不留痕迹的情况下盗走国宝？',scenes:[{id:'gallery',name:'展厅',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:30,y:25,w:40,h:30,l:'翡翠凤凰展柜'},{x:5,y:60,w:18,h:22,l:'警报控制面板'},{x:75,y:12,w:18,h:16,l:'通风口'}]},hotspots:[{id:'h1',x:50,y:40,ic:'display',name:'空展柜',desc:'展柜玻璃完好，锁具无破坏痕迹。但展柜底座有被打开的痕迹——内部有备用钥匙孔。',clues:['c8_01']},{id:'h2',x:14,y:68,ic:'lock',name:'警报面板',desc:'警报系统运行正常，但日志显示闭馆前5分钟有一次"测试关闭"操作，操作者ID为管理员级别。',clues:['c8_02']},{id:'h3',x:84,y:18,ic:'vent',name:'通风口',desc:'通风口栅格灰尘被扰动，内部有攀爬痕迹。通风管道连接展厅和外部。口径勉强容人通过。',clues:['c8_03']}]},{id:'control_rm',name:'监控室',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:15,y:10,w:70,h:16,l:'监控屏幕墙'},{x:5,y:50,w:25,h:25,l:'录像存储柜'},{x:65,y:55,w:28,h:22,l:'值班桌'}]},hotspots:[{id:'h4',x:50,y:18,ic:'display',name:'监控屏幕',desc:'所有屏幕显示正常，无异常画面。但仔细比对发现22:00-22:15的录像有循环播放痕迹。',clues:['c8_04']},{id:'h5',x:18,y:60,ic:'folder',name:'录像存储',desc:'录像存储硬盘有被格式化痕迹。恢复后发现22:00-22:15被15分钟的循环画面覆盖。',clues:['c8_05']},{id:'h6',x:78,y:65,ic:'clipboard',name:'值班日志',desc:'日志显示三人签字时间正常。但刘管理员的签字笔迹与平时略有不同。',clues:['c8_06']}]},{id:'ventilation',name:'通风管道',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:10,y:35,w:80,h:20,l:'主管道'},{x:5,y:65,w:20,h:20,l:'分支口'}]},hotspots:[{id:'h7',x:50,y:45,ic:'footprint',name:'管道内壁',desc:'管道内壁有鞋印和纤维刮痕。鞋印尺码42，与刘管理员日常穿着一致。',clues:['c8_07']},{id:'h8',x:15,y:72,ic:'key',name:'分支口',desc:'分支口通向展厅展柜后方。此处发现一把小型钥匙和微量玻璃胶残留。',clues:['c8_08']}]},{id:'storage_m',name:'文物库房',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:8,y:8,w:84,h:14,l:'储物架'},{x:25,y:45,w:50,h:25,l:'包装台'},{x:75,y:70,w:18,h:18,l:'工具柜'}]},hotspots:[{id:'h9',x:50,y:55,ic:'suitcase',name:'包装台',desc:'包装台上发现专业文物包装材料的残留——防震泡沫和定制木箱碎片。',clues:['c8_09']},{id:'h10',x:82,y:78,ic:'search',name:'工具柜',desc:'工具柜中有展柜备用钥匙的模具和配钥匙的工具。柜锁有刘管理员的指纹。',clues:['c8_10']}]}],suspects:[{id:'zhou',name:'老周',role:'夜班保安·值班10年',dlgs:[{t:'我10点和凌晨2点各巡查一次，展区一切正常。每个展柜都有感应器，触发就会报警。',r:[]},{q:'22:00到22:15你在做什么？',req:'c8_04',a:'我在监控室看屏幕。一切正常，没有任何异常。',r:[],c:true},{q:'刘管理员有展柜钥匙？',req:null,a:'只有他和馆长有主钥匙。但展柜底座有备用锁，备用钥匙也在刘管理员那里。',r:['c8_11']},{q:'老周，你的巡查路线经过通风口吗？',req:'c8_03',a:'经过。但我没发现异常……或者说，我没注意到。',r:['c8_12']}]},{id:'zhang',name:'小张',role:'清洁工·入职半年',dlgs:[{t:'我8点开始清洁，主要打扫公共区域。展柜我不碰，这是规矩。',r:[]},{q:'你清洁时接触过展区？',req:null,a:'只是拖地和倒垃圾。展区地面我拖过，但展柜碰都没碰。',r:[]},{q:'有人在通风口附近发现了你的清洁用品。',req:'c8_03',a:'我的抹布确实掉过一块……可能是清洁时掉在通风口附近的。',r:['c8_13'],c:true}]},{id:'liu',name:'刘建国',role:'文物管理员·任职15年',dlgs:[{t:'翡翠凤凰是国家一级文物，投保3亿。展柜钥匙只有我和馆长有。',r:[]},{q:'值班日志上你的签字笔迹不同。',req:'c8_06',a:'可能写快了。我每天签那么多字，有时候确实不太一样。',r:[],c:true},{q:'通风管道里有42码鞋印。',req:'c8_07',a:'我穿41码……可能记错了，也许是42。但这不能说明什么。',r:[],c:true},{q:'工具柜里有配钥匙的模具。',req:'c8_10',ev:'c8_10',a:'……我承认我配了备用钥匙。但我只是打开展柜看了一眼翡翠凤凰。我没偷！我只是……太喜欢它了。',r:['c8_14']}]}],clues:[{id:'c8_01',n:'展柜完好',d:'展柜玻璃和主锁完好，但底座备用锁有被开启痕迹。',cat:'物证'},{id:'c8_02',n:'警报关闭',d:'警报日志显示闭馆前5分钟有一次管理员级别的"测试关闭"操作。',cat:'物证'},{id:'c8_03',n:'通风痕迹',d:'通风口灰尘被扰动，内部有攀爬痕迹和鞋印。',cat:'物证'},{id:'c8_04',n:'录像循环',d:'22:00-22:15的监控录像被15分钟循环画面覆盖。',cat:'物证'},{id:'c8_05',n:'硬盘格式化',d:'监控存储硬盘有被格式化痕迹，原始录像被覆盖。',cat:'物证'},{id:'c8_06',n:'签字异常',d:'值班日志刘管理员签字笔迹与平时略有不同，疑似他人代签。',cat:'物证'},{id:'c8_07',n:'管道鞋印',d:'通风管道内42码鞋印，与刘管理员穿着尺码一致。',cat:'物证'},{id:'c8_08',n:'分支证据',d:'通风分支口发现展柜备用钥匙和玻璃胶残留。',cat:'物证'},{id:'c8_09',n:'包装材料',d:'包装台有专业文物包装材料残留——防震泡沫和木箱碎片。',cat:'物证'},{id:'c8_10',n:'配钥工具',d:'工具柜中有展柜备用钥匙模具和配钥匙工具，有刘管理员指纹。',cat:'物证'},{id:'c8_11',n:'钥匙管理',d:'展柜主钥匙和备用钥匙均由刘管理员保管。',cat:'口供'},{id:'c8_12',n:'保安疏忽',d:'老周承认巡查时可能未仔细检查通风口区域。',cat:'口供'},{id:'c8_13',n:'清洁用品',d:'通风口附近发现小张的清洁抹布，但他否认到过此处。',cat:'物证'},{id:'c8_14',n:'部分承认',d:'刘建国承认配了备用钥匙，但否认盗窃。',cat:'口供'},{id:'c8_15',n:'测试关闭',d:'警报"测试关闭"只能由管理员账号操作，指向刘建国。',cat:'推理'},{id:'c8_16',n:'内部作案',d:'展柜完好、警报未触发、监控被篡改——只有内部人员能做到。',cat:'推理'},{id:'c8_17',n:'完整路径',d:'刘建国通过通风管道进入展厅，用备用钥匙打开展柜，取走文物后原路返回。',cat:'推理'},{id:'c8_18',n:'预谋盗窃',d:'配钥匙模具、包装材料、监控篡改——盗窃经过长期精心策划。',cat:'推理'}],timeline:{events:[{id:'t1',text:'博物馆闭馆，安保系统启动',time:'18:00',order:0},{id:'t2',text:'刘管理员进行警报"测试关闭"',time:'17:55',order:1},{id:'t3',text:'小张开始清洁工作',time:'20:00',order:2},{id:'t4',text:'老周第一次巡查',time:'22:00',order:3},{id:'t5',text:'监控录像被循环画面覆盖',time:'22:00',order:4},{id:'t6',text:'刘管理员通过通风管道进入展厅',time:'22:05',order:5},{id:'t7',text:'翡翠凤凰被从展柜中取出',time:'22:10',order:6},{id:'t8',text:'刘管理员携带文物从通风管道离开',time:'22:15',order:7}]},synthesis:[{input:['c8_01','c8_02'],output:'c8_16',text:'展柜完好加警报被关闭——只有掌握钥匙和管理员权限的内部人员才能做到。'},{input:['c8_04','c8_07'],output:'c8_17',text:'监控循环加管道鞋印——刘管理员在监控盲区通过通风管道完成盗窃。'},{input:['c8_08','c8_10'],output:'c8_18',text:'备用钥匙和配钥模具——盗窃经过长期预谋，钥匙是提前准备的。'}],accusation:{suspect:'liu',evidence:['c8_07','c8_10','c8_17'],summary:'刘建国利用职务之便，提前复制展柜备用钥匙。闭馆前关闭警报系统，篡改监控录像。当晚通过通风管道进入展厅，用备用钥匙打开展柜取走翡翠凤凰，再从通风管道离开。整个过程不留痕迹。'},twist:{text:'你以为这只是贪念作祟？刘建国盗窃翡翠凤凰不是为了卖钱——他已经联系好了买家，一个海外收藏家。但真正令人震惊的是：馆长知道这一切。他默许刘建国盗窃，因为博物馆资金链断裂，他需要这笔"保险赔偿"来维持运营。三人合谋，一件国宝成了救命稻草。',contras:[{text:'警报被管理员级别账号关闭——只有刘建国有权限，且他在闭馆前5分钟操作。',ev:'c8_02'},{text:'通风管道鞋印42码，与刘管理员一致，且管道内发现他的工牌挂绳碎片。',ev:'c8_07'},{text:'工具柜的配钥模具有刘建国指纹——他提前复制了展柜备用钥匙。',ev:'c8_10'}]},endings:{surface:{title:'消失的凤凰',desc:'刘建国承认配了钥匙但否认盗窃。翡翠凤凰下落不明，案件仍在调查中。',stars:1},true_end:{title:'通风管的秘密',desc:'刘建国利用通风管道和备用钥匙盗走翡翠凤凰。他提前关闭警报、篡改监控，精心策划了这场"完美盗窃"。但管道里的鞋印和配钥工具出卖了他。文物在黑市交易前被追回。',stars:2},perfect:{title:'三方棋局',desc:'你揭开了令人唏嘘的真相：馆长因资金链断裂默许盗窃→刘建国执行→海外买家接盘。一件国宝成了三个"不得已"之人的救命稻草。刘建国被捕时平静地说："我只是做了馆长让我做的事。"馆长被调查，博物馆丑闻曝光。翡翠凤凰安然归来，但它承载的故事比任何人想象的都沉重。',stars:3}}},
{id:'c9',num:'009',name:'游轮迷案',diff:5,brief:'豪华游轮航行途中乘客王建国失踪。甲板监控拍到他独自走向船尾，之后杳无音讯。救生艇少了一艘。',briefing:'豪华游轮"海洋之星"从上海驶往日本。航行第二晚，乘客王建国失踪。甲板监控显示他最后独自走向船尾方向，之后没有任何影像。舱房内有打斗痕迹和血迹，保险箱被打开，重要文件失踪。救生艇少了一艘3号艇，但投放记录为空。同行的女伴孙雅琴声称9点就已入睡。但真相远比表面复杂……',scenes:[{id:'cabin',name:'王建国舱房',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:30,y:25,w:40,h:25,l:'双人床'},{x:5,y:10,w:20,h:16,l:'保险箱'},{x:70,y:60,w:22,h:22,l:'阳台门'},{x:5,y:65,w:18,h:20,l:'衣柜'}]},hotspots:[{id:'h1',x:50,y:38,ic:'blood',name:'打斗痕迹',desc:'舱房内桌椅翻倒，地毯上有血迹和拉扯痕迹。床头柜碎裂，上面有王建国的手表碎片。',clues:['c9_01']},{id:'h2',x:15,y:18,ic:'lock',name:'保险箱',desc:'保险箱被打开，内部文件被取走。箱面有王建国和另一个人的指纹——孙雅琴。',clues:['c9_02']},{id:'h3',x:80,y:68,ic:'window',name:'阳台',desc:'阳台栏杆有新鲜刮痕和纤维残留。栏杆外侧有攀爬痕迹。下方是茫茫大海。',clues:['c9_03']},{id:'h4',x:14,y:72,ic:'phone',name:'手机',desc:'王建国的手机在床底发现，屏幕碎裂。最后通话记录是打给孙雅琴，时长3分钟。',clues:['c9_04']}]},{id:'deck',name:'顶层甲板',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:10,y:10,w:25,h:15,l:'监控摄像头'},{x:55,y:15,w:30,h:18,l:'救生艇架'},{x:30,y:60,w:35,h:20,l:'观景台'}]},hotspots:[{id:'h5',x:22,y:16,ic:'camera',name:'监控位置',desc:'甲板监控拍到王建国21:00独自走向船尾。21:10孙雅琴也出现在甲板上，方向相同。',clues:['c9_05']},{id:'h6',x:68,y:22,ic:'key',name:'救生艇架',desc:'3号救生艇不见，投放记录为空。但机械师检查发现释放装置有被手动操作的痕迹。',clues:['c9_06']},{id:'h7',x:45,y:68,ic:'footprint',name:'船尾栏杆',desc:'船尾栏杆有抓握痕迹和一处血迹。血迹DNA属于王建国。栏杆边发现孙雅琴的丝巾碎片。',clues:['c9_07']}]},{id:'bridge',name:'驾驶台',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:20,y:10,w:60,h:18,l:'操控台'},{x:5,y:55,w:25,h:22,l:'海图桌'},{x:70,y:55,w:22,h:25,l:'通讯设备'}]},hotspots:[{id:'h8',x:50,y:18,ic:'display',name:'操控台',desc:'航行日志显示航线正常，无偏航。21:00-21:30船速略有降低。',clues:['c9_08']},{id:'h9',x:80,y:65,ic:'clipboard',name:'船员值班表',desc:'值班表显示21:00-22:00甲板无人巡逻。李服务员该时段声称在厨房。',clues:['c9_09']}]},{id:'lifeboat_d',name:'救生艇甲板',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:10,y:10,w:80,h:14,l:'救生艇架'},{x:25,y:50,w:50,h:25,l:'紧急设备柜'}]},hotspots:[{id:'h10',x:50,y:16,ic:'search',name:'空艇位',desc:'3号艇位置空置。释放轨道有新鲜润滑痕迹，说明近期被使用过。',clues:['c9_10']},{id:'h11',x:50,y:60,ic:'fingerprint',name:'设备柜',desc:'紧急设备柜中发现一件湿过的女式外套，口袋里有孙雅琴的房卡。',clues:['c9_11']}]}],suspects:[{id:'zhao_c',name:'赵船长',role:'船长·航海30年',dlgs:[{t:'航线没有任何变化，按原定路线行驶。救生艇少的是3号艇，投放记录为空说明系统未检测到释放。',r:[]},{q:'21:00到21:30船速为什么降低了？',req:'c9_08',a:'那是正常的航速调整。那段海域有轻微逆流。',r:[]},{q:'救生艇释放装置有手动操作痕迹。',req:'c9_06',a:'手动释放需要专业知识。不是随便什么人都会操作的。',r:['c9_12']},{q:'赵船长，你与王建国认识？',req:'c9_04',a:'……他之前搭乘过我的船。只是一面之缘。',r:['c9_13'],c:true}]},{id:'li_w',name:'李服务员',role:'客房服务员',dlgs:[{t:'我8点给王先生送了晚餐。他接了个电话后表情很紧张。之后我就回厨房了。',r:[]},{q:'那个电话是谁打的？',req:'c9_04',a:'我不知道。但他的手机通话记录应该能查到。',r:[]},{q:'值班表显示21:00-22:00甲板无人巡逻。',req:'c9_09',a:'那天晚上甲板巡逻确实空了。我在厨房帮忙，没注意到。',r:['c9_14']}]},{id:'sun_n',name:'孙雅琴',role:'同行女伴·商人',dlgs:[{t:'我和王先生是生意伙伴，一起出来谈合作。昨晚我在房间9点就睡了，什么都不知道。',r:[]},{q:'监控显示你21:10也出现在甲板上。',req:'c9_05',a:'我……我睡不着出来走走。但王先生已经不在那了。',r:[],c:true},{q:'保险箱上有你的指纹。',req:'c9_02',a:'我之前打开过保险箱拿我的护照。这很正常。',r:[],c:true},{q:'设备柜里的女式外套有你的房卡。',req:'c9_11',ev:'c9_11',a:'……好吧。我承认我当晚去了甲板。我和王先生发生了争执。他要把我们的合同作废……我推了他。他不是故意的，是栏杆太滑了……',r:['c9_15']}]}],clues:[{id:'c9_01',n:'打斗痕迹',d:'舱房内有桌椅翻倒、血迹和拉扯痕迹，发生过激烈冲突。',cat:'物证'},{id:'c9_02',n:'保险箱指纹',d:'保险箱面有王建国和孙雅琴的指纹，内部文件被取走。',cat:'物证'},{id:'c9_03',n:'阳台刮痕',d:'阳台栏杆有新鲜刮痕、纤维和攀爬痕迹，通向大海方向。',cat:'物证'},{id:'c9_04',n:'最后通话',d:'王建国手机最后通话是打给孙雅琴，时长3分钟。手机在床底发现。',cat:'物证'},{id:'c9_05',n:'甲板监控',d:'监控拍到王建国21:00走向船尾，孙雅琴21:10也出现在同一方向。',cat:'物证'},{id:'c9_06',n:'救生艇痕迹',d:'3号艇释放装置有手动操作痕迹，需要专业知识。',cat:'物证'},{id:'c9_07',n:'船尾证据',d:'船尾栏杆有王建国血迹和孙雅琴丝巾碎片。',cat:'物证'},{id:'c9_08',n:'航速变化',d:'21:00-21:30船速降低，可能是为了等人或物回船。',cat:'物证'},{id:'c9_09',n:'巡逻空缺',d:'21:00-22:00甲板无人巡逻，为作案提供了时间窗口。',cat:'文件'},{id:'c9_10',n:'释放轨道',d:'救生艇释放轨道有新鲜润滑痕迹，近期被使用过。',cat:'物证'},{id:'c9_11',n:'女式外套',d:'紧急设备柜发现湿过的女式外套，口袋有孙雅琴房卡。',cat:'物证'},{id:'c9_12',n:'专业操作',d:'救生艇手动释放需要训练，普通乘客不会操作。',cat:'推理'},{id:'c9_13',n:'船长谎言',d:'赵船长声称与王建国只是一面之缘，但航海日志显示王建国是常客。',cat:'口供'},{id:'c9_14',n:'巡逻漏洞',d:'李服务员承认未注意到甲板巡逻空缺，可能存在疏忽。',cat:'口供'},{id:'c9_15',n:'推人自白',d:'孙雅琴承认在甲板与王建国争执中推了他，声称是意外。',cat:'口供'},{id:'c9_16',n:'商业纠纷',d:'失踪文件是两人合作的商业合同，孙雅琴有重大利益冲突。',cat:'推理'},{id:'c9_17',n:'救生艇返回',d:'救生艇被释放后又手动放回——孙雅琴用救生艇下海后返回。',cat:'推理'},{id:'c9_18',n:'船长协助',d:'船速降低是为了配合救生艇返回——赵船长可能知情或协助。',cat:'推理'}],timeline:{events:[{id:'t1',text:'李服务员送晚餐到王建国舱房',time:'20:00',order:0},{id:'t2',text:'王建国打电话给孙雅琴',time:'20:30',order:1},{id:'t3',text:'监控拍到王建国独自走向船尾',time:'21:00',order:2},{id:'t4',text:'监控拍到孙雅琴走向同一方向',time:'21:10',order:3},{id:'t5',text:'船速降低',time:'21:15',order:4},{id:'t6',text:'王建国在船尾被推落海中',time:'21:20',order:5},{id:'t7',text:'孙雅琴释放救生艇下海',time:'21:25',order:6},{id:'t8',text:'孙雅琴返回游轮，藏匿外套',time:'21:45',order:7}]},synthesis:[{input:['c9_05','c9_07'],output:'c9_15',text:'监控和船尾证据——孙雅琴跟随王建国到船尾并发生了冲突。'},{input:['c9_06','c9_10'],output:'c9_17',text:'救生艇手动操作痕迹——有人下海后又手动将艇放回。'},{input:['c9_08','c9_12'],output:'c9_18',text:'船速降低配合救生艇操作——赵船长可能知道发生了什么。'}],accusation:{suspect:'sun_n',evidence:['c9_05','c9_07','c9_15'],summary:'孙雅琴因商业纠纷在甲板与王建国发生争执，将其推入海中。随后释放救生艇下海确认，又手动放回救生艇返回游轮。她藏匿外套伪造不在场证明，但监控和物证揭穿了谎言。'},twist:{text:'你以为孙雅琴是独自作案？船速在21:15降低——这不是"正常调整"，而是赵船长故意减速配合救生艇返回。赵船长与王建国并非"一面之缘"——他们是旧识，赵船长甚至知道王建国今晚会有"意外"。他故意取消甲板巡逻，降低船速，为孙雅琴创造了完美的作案条件。但他们的分歧在于：赵船长只想"消失"王建国，孙雅琴却想要他的命。',contras:[{text:'孙雅琴声称9点入睡，但监控显示她21:10出现在甲板走向船尾。',ev:'c9_05'},{text:'救生艇手动释放需要专业训练——但孙雅琴的父亲是退役海军。',ev:'c9_06'},{text:'船速降低与救生艇操作时间吻合——赵船长在配合什么。',ev:'c9_08'}]},endings:{surface:{title:'甲板上的真相',desc:'孙雅琴承认在甲板推了王建国，声称是意外。救生艇和丝巾碎片成为关键证据。但案件仍有诸多疑点未解。',stars:1},true_end:{title:'深海之下',desc:'孙雅琴因商业纠纷在甲板将王建国推入海中，用救生艇下海确认后返回。她藏匿外套、伪造不在场证明。但监控拍到了她的行踪，船尾留下了她的丝巾。大海能吞没证据，但吞没不了真相。',stars:2},perfect:{title:'航海日志的秘密',desc:'你揭开了双人合谋的全貌：赵船长取消巡逻、降低船速配合孙雅琴作案。两人各怀目的——赵船长要王建国"消失"以掩盖过去的秘密，孙雅琴要他的命以解决商业纠纷。救生艇的去与回、船速的降与升，都是精心编排的死亡之舞。但你在航海日志中找到了破绽——赵船长亲手写下了自己的罪证。',stars:3}}},
{id:'c10',num:'010',name:'古宅惊魂',diff:5,brief:'百年古宅翻修时墙内发现白骨。DNA确认死者是20年前失踪的宅主陈老太。侄子、邻居、退休警察各有隐情。',briefing:'郊外百年古宅翻修时，工人在拆除内墙时发现一具白骨。DNA比对确认死者是20年前失踪的宅主陈秀兰。当年陈老太独居，失踪后被认定"离家出走"，房产由侄子陈志强继承。如今白骨重见天日，头部有明显钝器伤。20年前的三名相关人员再次被传唤：继承房产的侄子陈志强、隔壁邻居王阿婆、当年负责案件的退休警察张国强。',scenes:[{id:'living_r',name:'古宅客厅',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:25,y:20,w:50,h:25,l:'发现白骨的墙体'},{x:5,y:55,w:20,h:25,l:'老照片墙'},{x:70,y:55,w:22,h:20,l:'地窖入口'}]},hotspots:[{id:'h1',x:50,y:32,ic:'blood',name:'白骨发现处',desc:'墙内白骨头部有明显钝器伤。骨骼旁发现一枚锈蚀的铜纽扣和几缕头发。墙体有二次砌筑痕迹。',clues:['c10_01']},{id:'h2',x:15,y:65,ic:'photo',name:'老照片墙',desc:'照片中有陈老太与侄子的合影。一张照片背面写着"志强欠赌债50万——绝不能给他"。',clues:['c10_02']},{id:'h3',x:80,y:62,ic:'door',name:'地窖入口',desc:'地窖内发现干涸血迹、旧衣物碎片和一把生锈的铁锤。铁锤上有暗色残留物。',clues:['c10_03']}]},{id:'cellar',name:'地窖',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:10,y:10,w:30,h:25,l:'旧木箱'},{x:55,y:15,w:35,h:20,l:'工具架'},{x:20,y:60,w:60,h:20,l:'工作台'}]},hotspots:[{id:'h4',x:25,y:20,ic:'suitcase',name:'旧木箱',desc:'木箱中有陈老太的遗物：日记本、存折和一封未寄出的信。',clues:['c10_04']},{id:'h5',x:70,y:22,ic:'search',name:'工具架',desc:'工具架上有水泥、砖刀和抹子——与墙体二次砌筑使用的工具一致。',clues:['c10_05']},{id:'h6',x:50,y:68,ic:'fingerprint',name:'工作台',desc:'工作台上发现干涸血迹和几份赌博欠条。欠条上的名字是"陈志强"。',clues:['c10_06']}]},{id:'construction',name:'翻修工地',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:8,y:8,w:84,h:14,l:'建材堆'},{x:25,y:45,w:50,h:20,l:'施工区'},{x:70,y:70,w:22,h:18,l:'工人休息区'}]},hotspots:[{id:'h7',x:50,y:15,ic:'clipboard',name:'施工记录',desc:'施工记录显示发现白骨的墙体砌筑时间约为18-22年前。水泥批次与20年前一致。',clues:['c10_07']},{id:'h8',x:80,y:78,ic:'person',name:'工人证言',desc:'带头工人说砌墙时发现头发，以为是动物毛发没在意。现在回想起来那些头发很长。',clues:['c10_08']}]},{id:'garden_o',name:'古宅花园',layout:{walls:[{x:0,y:0,w:100,h:2},{x:0,y:98,w:100,h:2},{x:0,y:0,w:2,h:100},{x:98,y:0,w:2,h:100}],furniture:[{x:8,y:8,w:25,h:20,l:'老槐树'},{x:55,y:12,w:30,h:18,l:'石桌'},{x:70,y:60,w:22,h:25,l:'围墙'}]},hotspots:[{id:'h9',x:20,y:16,ic:'search',name:'老槐树下',desc:'槐树下挖出一个铁盒，里面有陈老太的身份证和一张20年前的火车票。',clues:['c10_09']},{id:'h10',x:78,y:68,ic:'footprint',name:'围墙',desc:'围墙角落有新鲜翻土痕迹。挖开后发现一部旧手机和一块带血的手帕。',clues:['c10_10']}]}],suspects:[{id:'chen_n',name:'陈志强',role:'陈老太侄子·房产继承人',dlgs:[{t:'姑姑失踪时我在外地出差，回来才知道。房产是按法律程序继承的。',r:[]},{q:'照片背面写"绝不能给50万"。',req:'c10_02',a:'那是……那是以前的事了。我后来改了，不再赌博。姑姑误会了。',r:['c10_11']},{q:'地窖工作台上有你的赌博欠条。',req:'c10_06',a:'那些是姑姑的！不是我的！她……她也赌博。',r:[],c:true},{q:'铁锤上的血迹和墙体砌筑时间吻合。',req:'c10_03',ev:'c10_03',a:'……好吧。那天晚上我去找姑姑借钱，她不肯。我们吵了起来。我拿起铁锤……我不是故意的。之后我把她砌进了墙里。',r:['c10_12']}]},{id:'wang_l',name:'王阿婆',role:'隔壁邻居·居住40年',dlgs:[{t:'我最后一次见秀兰是20年前，她说不舒服要休息。当晚我好像听到争吵声。',r:[]},{q:'你听到争吵为什么不报警？',req:null,a:'我以为是家庭矛盾……而且第二天她就"走了"。我以为她真的离家出走了。',r:['c10_13']},{q:'你当晚看到陈志强了吗？',req:'c10_13',a:'我……我确实看到志强当晚在古宅附近。但他说是来看姑姑的。',r:['c10_14']},{q:'围墙下埋的旧手机是陈老太的。',req:'c10_10',a:'秀兰的手机？怎么会埋在围墙下……她那天晚上打过电话吗？',r:['c10_15']}]},{id:'zhang_j',name:'张国强',role:'退休警察·原案负责人',dlgs:[{t:'当年案件我判断是离家出走。没找到尸体，也没有明显犯罪证据。',r:[]},{q:'你当年走访过邻居吗？',req:null,a:'走访过。王阿婆说没异常。陈志强说在外地。没有发现可疑之处。',r:[]},{q:'当年为什么不进行更深入调查？',req:'c10_13',a:'没有报案人，没有可疑痕迹。陈老太独居多年，偶尔出门旅行。看起来就是自愿离开。',r:['c10_16']},{q:'你在结案报告里遗漏了王阿婆提到的"争吵声"。',req:'c10_14',ev:'c10_14',a:'……我确实知道这个信息。但当时判断不重要。也许……也许是我疏忽了。',r:['c10_17'],c:true}]}],clues:[{id:'c10_01',n:'墙内白骨',d:'白骨头部有钝器伤，墙体有二次砌筑痕迹，砌筑时间约18-22年前。',cat:'物证'},{id:'c10_02',n:'照片留言',d:'照片背面写"志强欠赌债50万——绝不能给他"，是陈老太笔迹。',cat:'物证'},{id:'c10_03',n:'锈蚀铁锤',d:'地窖发现生锈铁锤，上有暗色残留物，初检为人血。',cat:'物证'},{id:'c10_04',n:'陈老太遗物',d:'木箱中有日记本、存折和未寄出的信。信中写道"志强越来越危险"。',cat:'物证'},{id:'c10_05',n:'砌筑工具',d:'工具架上有水泥、砖刀等工具，与墙体二次砌筑使用的一致。',cat:'物证'},{id:'c10_06',n:'赌博欠条',d:'工作台上发现赌博欠条，署名"陈志强"，总额超过50万。',cat:'物证'},{id:'c10_07',n:'砌筑时间',d:'施工记录确认墙体砌筑时间约18-22年前，水泥批次与20年前一致。',cat:'文件'},{id:'c10_08',n:'工人发现',d:'工人证实砌墙时发现长发毛发，当时误以为动物毛发未上报。',cat:'口供'},{id:'c10_09',n:'身份证据',d:'槐树下铁盒有陈老太身份证和20年前的火车票——她并未"离家出走"。',cat:'物证'},{id:'c10_10',n:'围墙秘密',d:'围墙下埋有陈老太的旧手机和带血手帕。',cat:'物证'},{id:'c10_11',n:'赌债真相',d:'陈志强承认欠下赌债50万，向姑姑借钱被拒。',cat:'口供'},{id:'c10_12',n:'杀人自白',d:'陈志强承认当晚争吵中用铁锤杀害姑姑并砌墙藏尸。',cat:'口供'},{id:'c10_13',n:'邻居隐瞒',d:'王阿婆20年前听到争吵声但未报警，也未向警方完整陈述。',cat:'口供'},{id:'c10_14',n:'目击证言',d:'王阿婆承认当晚看到陈志强在古宅附近。',cat:'口供'},{id:'c10_15',n:'最后通话',d:'陈老太的手机被埋在围墙下——她可能在遇害前拨打过电话或发送过信息。',cat:'推理'},{id:'c10_16',n:'调查疏忽',d:'张国强当年未深入调查，遗漏了关键证人证言。',cat:'推理'},{id:'c10_17',n:'遗漏信息',d:'张国强承认知道王阿婆提到争吵声但未写入结案报告。',cat:'口供'},{id:'c10_18',n:'完整真相',d:'陈志强因赌债向姑姑借钱被拒，用铁锤杀害后砌墙藏尸，伪造离家出走假象。',cat:'推理'}],timeline:{events:[{id:'t1',text:'陈志强到达古宅找陈老太',time:'20:00',order:0},{id:'t2',text:'陈老太拒绝借钱，两人发生争吵',time:'20:30',order:1},{id:'t3',text:'王阿婆听到争吵声',time:'20:45',order:2},{id:'t4',text:'陈志强用铁锤杀害陈老太',time:'21:00',order:3},{id:'t5',text:'陈志强砌墙藏尸',time:'22:00',order:4},{id:'t6',text:'陈志强伪造姑姑离家出走假象',time:'23:00',order:5},{id:'t7',text:'陈志强将手机和手帕埋在围墙下',time:'23:30',order:6},{id:'t8',text:'陈志强离开古宅，次日以"出差回来"身份报失踪',time:'08:00',order:7}]},synthesis:[{input:['c10_01','c10_07'],output:'c10_18',text:'白骨钝器伤加砌筑时间——陈老太被杀后砌入墙中，时间在20年前。'},{input:['c10_02','c10_06'],output:'c10_11',text:'照片留言和赌博欠条——陈志强有明确的杀人动机。'},{input:['c10_03','c10_14'],output:'c10_12',text:'铁锤血迹加目击证言——陈志强当晚在古宅用铁锤杀害了陈老太。'}],accusation:{suspect:'chen_n',evidence:['c10_01','c10_03','c10_06'],summary:'陈志强因50万赌债向姑姑陈老太借钱被拒，在争吵中用铁锤将其杀害。他砌墙藏尸，伪造姑姑离家出走假象，最终继承了房产。20年后翻修时白骨重见天日。'},twist:{text:'你以为这只是侄子弑姑的惨剧？退休警察张国强当年真的只是"疏忽"吗？陈志强入狱后交代，当年是张国强帮他"处理"了现场——因为张国强也欠了陈志强的赌债。王阿婆的沉默也不是因为"以为是家庭矛盾"——她收到了陈志强的"封口费"。三个人的沉默，让一具白骨在墙里等了20年。',contras:[{text:'陈志强声称在外地出差，但王阿婆看到他当晚在古宅附近。',ev:'c10_14'},{text:'墙体二次砌筑需要时间和工具——凶手熟悉房屋结构且有准备。',ev:'c10_05'},{text:'陈老太的手机被埋在围墙下——她可能在遇害前试图求助。',ev:'c10_10'}]},endings:{surface:{title:'墙中的真相',desc:'陈志强被捕，承认因赌债杀害姑姑。20年前的命案真相大白，古宅将被拆除。但白骨手机里的秘密仍未解开。',stars:1},true_end:{title:'二十年的沉默',desc:'陈志强用铁锤杀害姑姑后砌墙藏尸，伪造离家出走假象继承房产。王阿婆听到争吵却沉默，张国强调查草率结案。三个人的疏忽或故意，让一具白骨在墙中等待了20年。正义迟到，但终究到来。',stars:2},perfect:{title:'古宅的亡魂',desc:'你揭开了完整的真相链：陈志强赌债缠身→借钱被拒→铁锤杀人→砌墙藏尸→张国强帮忙掩盖→王阿婆收钱沉默。陈老太的手机里最后一条短信是发给张国强的："志强要伤害我，请帮我。"但那条短信从未被读取。20年后，你替她读到了。古宅拆除了，但陈秀兰的名字终于不再是"失踪者"——她是受害者，是幸存者，是被遗忘太久的人。',stars:3}}}

/* ===== AUDIO ===== */
const audioCtx=new(window.AudioContext||window.webkitAudioContext)();
function playSound(type){
  if(!settings.sfx)return;
  try{
    if(audioCtx.state==='suspended')audioCtx.resume();
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.connect(gain);gain.connect(audioCtx.destination);
    if(type==='clue'){osc.frequency.value=800;gain.gain.setValueAtTime(0.15,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.2);}
    else if(type==='ok'){osc.frequency.value=1000;gain.gain.setValueAtTime(0.15,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3);}
    else if(type==='warn'){osc.frequency.value=400;gain.gain.setValueAtTime(0.15,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.15);}
    else if(type==='twist'){osc.frequency.value=600;osc.frequency.exponentialRampToValueAtTime(300,audioCtx.currentTime+0.5);gain.gain.setValueAtTime(0.15,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.5);}
    osc.start(audioCtx.currentTime);osc.stop(audioCtx.currentTime+0.5);
  }catch(e){}
}
let bgmNodes=null;
function startBGM(){
  if(bgmNodes||!settings.bgm)return;
  try{
    const g=audioCtx.createGain();g.gain.value=0.05;g.connect(audioCtx.destination);
    const o1=audioCtx.createOscillator();o1.type='sine';o1.frequency.value=110;
    const o2=audioCtx.createOscillator();o2.type='sine';o2.frequency.value=165;
    const o3=audioCtx.createOscillator();o3.type='triangle';o3.frequency.value=220;
    const lfo=audioCtx.createOscillator();lfo.type='sine';lfo.frequency.value=0.1;
    const lfoG=audioCtx.createGain();lfoG.gain.value=5;
    lfo.connect(lfoG);lfoG.connect(o1.frequency);lfoG.connect(o2.frequency);
    o1.connect(g);o2.connect(g);o3.connect(g);
    o1.start();o2.start();o3.start();lfo.start();
    bgmNodes={g,o1,o2,o3,lfo};
  }catch(e){}
}
function stopBGM(){
  if(!bgmNodes)return;
  try{bgmNodes.o1.stop();bgmNodes.o2.stop();bgmNodes.o3.stop();bgmNodes.lfo.stop();bgmNodes.g.disconnect();}catch(e){}
  bgmNodes=null;
}

function showHint(){
  if(G.insight<=0){toast('洞察点已用完','warn');return}
  let c=CC2();if(!c)return;
  let hints=[];
  if(G.tab==='scene'){
    let sc=c.scenes[G.curSc];
    let unexplored=sc.hotspots.filter(h=>h.clues.some(cl=>!hasClue(cl)));
    if(unexplored.length>0)hints.push(`场景中还有${unexplored.length}个可疑点未调查`);
  }else if(G.tab==='suspect'){
    let uninterrogated=c.suspects.filter(s=>!G.usedQ[s.id]||G.usedQ[s.id].length===0);
    if(uninterrogated.length>0)hints.push(`还有${uninterrogated.length}位嫌疑人未询问`);
  }else if(G.tab==='timeline'){
    let pl=G.tlPlace[c.id]||{};
    let placed=Object.keys(pl).length;
    let total=c.timeline.events.length;
    if(placed<total)hints.push(`时间线还有${total-placed}个事件未放置`);
  }else if(G.tab==='clues'){
    let available=c.synthesis.filter(sy=>!G.synthDone.includes(sy.input.slice().sort().join(',')));
    if(available.length>0)hints.push(`还有${available.length}组合成线索可发现`);
  }else if(G.tab==='accuse'){
    if(!G.accSt.suspect)hints.push('选择你认为的凶手');
    else if(G.accSt.evidence.length<2)hints.push('至少选择2条关键证据');
  }
  if(hints.length===0)hints.push('继续探索，真相就在眼前');
  G.insight--;G.hints++;save();
  showModal(`${S('i-bulb',18)} 洞察提示`,`<p style="line-height:1.8">${hints[0]}</p><p style="font-size:12px;color:#9aa0a6;margin-top:12px">剩余洞察点：${G.insight}</p>`,`<button class="modal-btn" onclick="closeModal();render()">确定</button>`);
}
